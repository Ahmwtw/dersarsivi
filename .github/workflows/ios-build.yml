name: iOS derlemesi

on:
  push:
    branches: [main]
  pull_request:

jobs:
  simulator-build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Xcode sürümü
        run: xcodebuild -version
      - name: XcodeGen kur
        run: brew install xcodegen
      - name: Xcode projesini üret
        run: xcodegen generate
      - name: Çekirdek testleri (macOS)
        run: swift test --package-path Core
      - name: Uygulamayı simülatör için derle (imzasız)
        # Testler kırmızı olsa da uygulama derlemesinin sonucunu görmek için çalışır.
        if: success() || failure()
        run: |
          set -o pipefail
          xcodebuild -project DersArsivi.xcodeproj -scheme DersArsivi \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO build
