<style>
/* Yerleşim: solda yapışkan anatomi şeması, sağda kaydırılan panel. Arter kırmızı, ven mavi. */
:root {
  --bg: #f7f8fb; --fg: #1d2330; --muted: #5d6779; --line: #e2e6ee; --card: #ffffff; --figbg: #ffffff;
  --art: #cf3036; --art-soft: #fdecec; --ven: #2e5fd0; --ven-soft: #eaf0fd;
  --star: #c98a00; --star-soft: #fff4d6; --lm: #7a3fb8; --lm-soft: #f3ecfb; --body: #e9ecf2; --organ: #d8dde7;
  --f: "Lexend", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11141a; --fg: #e5e8ef; --muted: #a0a8b8; --line: #2a303b; --card: #181c24; --figbg: #141820;
  --art: #ff6b6f; --art-soft: #3a1c1f; --ven: #7aa2ff; --ven-soft: #1b2440;
  --star: #f2be4a; --star-soft: #3a2f12; --lm: #c69bf5; --lm-soft: #2c2140; --body: #232935; --organ: #2e3544; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #11141a; --fg: #e5e8ef; --muted: #a0a8b8; --line: #2a303b; --card: #181c24; --figbg: #141820;
  --art: #ff6b6f; --art-soft: #3a1c1f; --ven: #7aa2ff; --ven-soft: #1b2440;
  --star: #f2be4a; --star-soft: #3a2f12; --lm: #c69bf5; --lm-soft: #2c2140; --body: #232935; --organ: #2e3544; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--f); font-weight: 300; font-size: 15.5px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 24px; }
button { font: inherit; color: inherit; }
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding-block: 14px 10px; }
.top h1 { margin: 0; font-size: 1.35rem; font-weight: 600; margin-right: auto; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; background: color-mix(in srgb, var(--fg) 6%, transparent); padding: 4px; border-radius: 999px; }
.seg button { border: 0; background: transparent; padding: 6px 13px; border-radius: 999px; cursor: pointer; font-weight: 500; font-size: .92rem; white-space: nowrap; }
.seg button[aria-selected="true"], .seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.seg button:focus-visible, .btn:focus-visible, .opt:focus-visible, .tname:focus-visible, .qitem:focus-visible { outline: 3px solid var(--ven); outline-offset: 2px; }
.ctl { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding-bottom: 10px; }
.zoom { display: flex; gap: 4px; flex-wrap: wrap; }
.zoom button { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 3px 10px; font-size: .8rem; cursor: pointer; }
.legend { display: flex; gap: 12px; font-size: .78rem; color: var(--muted); flex-wrap: wrap; }
.legend i { display: inline-block; width: 18px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }
.main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 18px; align-items: start; }
.figwrap { position: sticky; top: 10px; height: calc(100vh - 140px); min-height: 420px; background: var(--figbg); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
#fig { width: 100%; height: 100%; display: block; touch-action: manipulation; }
#panel { min-width: 0; max-height: calc(100vh - 140px); overflow-y: auto; padding-right: 4px; }
@media (max-width: 820px) {
  .main { grid-template-columns: 1fr; }
  .figwrap { top: env(safe-area-inset-top, 0px); height: 46vh; min-height: 300px; z-index: 3; }
  #panel { max-height: none; overflow: visible; }
}
/* şema */
.bodyfill { fill: var(--body); stroke: none; }
.organ { fill: none; stroke: var(--organ); stroke-width: 1.2px; vector-effect: non-scaling-stroke; }
.organf { fill: var(--organ); opacity: .55; }
.v .ln { fill: none; stroke: var(--c); stroke-width: calc(var(--w, 2) * var(--k, 1) * 1px); stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; transition: opacity .25s; }
.v.art { --c: var(--art); } .v.ven { --c: var(--ven); }
.v.deep .ln { stroke-dasharray: 5 3; }
.v .hit { fill: none; stroke: transparent; stroke-width: 14px; vector-effect: non-scaling-stroke; pointer-events: stroke; cursor: pointer; }
.v.off, .v.gone, .v.rootv { display: none; }
.v.dim { opacity: .14; }
.v.seen { opacity: .35; }
.v.prev .ln { opacity: .55; stroke-dasharray: 2 4; }
.v.kid { opacity: .75; }
.v.path .ln { opacity: 1; }
.v.cur .ln { stroke-width: calc(6px * max(var(--k, 1), .7)); filter: drop-shadow(0 0 4px var(--c)); }
.v.star .ln { stroke: var(--star); stroke-width: calc(3.4px * max(var(--k, 1), .7)); }
.v.wrong { opacity: .55; } .v.wrong .ln { stroke-dasharray: 1 4; }
.lb { font-size: var(--fs, 13px); fill: var(--fg); paint-order: stroke; stroke: var(--figbg); stroke-width: calc(var(--fs, 13px) * .28); stroke-linejoin: round; font-family: var(--f); pointer-events: none; }
.lb.faint { opacity: .55; font-size: calc(var(--fs, 13px) * .82); }
.lb.curl { font-weight: 600; }
.mk { fill: var(--lm); opacity: .9; }
.mkt { fill: var(--lm); font-weight: 600; }
@media (prefers-reduced-motion: no-preference) { .mk { animation: pulse 1.6s ease-in-out infinite; } }
@keyframes pulse { 50% { opacity: .35; } }
.drop.art { fill: var(--art); } .drop.ven { fill: var(--ven); }
/* panel */
.intro p { margin: 0 0 8px; }
.hint { color: var(--muted); font-size: .92rem; }
.sh { font-size: .98rem; font-weight: 600; margin: 18px 0 8px; }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 4px; margin-bottom: 10px; font-size: .8rem; }
.crumb { border: 0; background: none; padding: 2px 4px; cursor: pointer; color: var(--muted); border-radius: 6px; text-align: left; }
.crumb.on { color: var(--fg); font-weight: 600; }
.sep { color: var(--muted); }
.cur { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; display: grid; gap: 8px; }
.cur.art { border-color: color-mix(in srgb, var(--art) 35%, var(--line)); } .cur.ven { border-color: color-mix(in srgb, var(--ven) 35%, var(--line)); }
.cur p { margin: 0; }
.curh { display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; }
.cur h2 { margin: 0; font-size: 1.2rem; font-weight: 600; text-wrap: balance; }
.cur.art h2 { color: var(--art); } .cur.ven h2 { color: var(--ven); } .cur.lmc h2 { color: var(--lm); }
.side { font-size: .72rem; border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; color: var(--muted); }
.route { font-size: .82rem; color: var(--muted); }
.lmbanner { background: var(--lm-soft); border-radius: 12px; padding: 9px 12px; display: grid; gap: 2px; font-size: .9rem; }
.lmbanner b { color: var(--lm); font-weight: 600; }
.qchips { display: flex; flex-direction: column; gap: 6px; }
.qchip, .linkchip { text-align: left; border: 0; border-radius: 10px; padding: 7px 11px; cursor: pointer; font-size: .86rem; }
.qchip { background: var(--star-soft); } .linkchip { background: color-mix(in srgb, var(--fg) 7%, transparent); }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { display: grid; gap: 2px; text-align: left; border: 1px solid var(--line); background: var(--card); border-radius: 14px; padding: 11px 14px; cursor: pointer; transition: transform .12s, border-color .12s; }
.opt:hover { transform: translateX(3px); }
.opt.art:hover { border-color: var(--art); } .opt.ven:hover { border-color: var(--ven); }
.opt .on { font-weight: 500; }
.opt.art .on { color: var(--art); } .opt.ven .on { color: var(--ven); }
.opt small { color: var(--muted); font-weight: 300; }
.opt .pv { font-size: .82rem; color: var(--muted); opacity: .8; }
.bd { font-size: .8rem; }
.navrow { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.btn { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-size: .88rem; }
.btn:disabled { opacity: .4; cursor: default; }
input[type=search] { width: 100%; margin: 14px 0 8px; padding: 9px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--fg); font: inherit; }
.tree { font-size: .9rem; }
.tk { padding-left: 14px; border-left: 1px dashed var(--line); margin-left: 9px; }
.trow { display: flex; align-items: center; gap: 2px; }
.tog { width: 20px; flex: none; border: 0; background: none; cursor: pointer; color: var(--muted); padding: 0; }
.tog.sp { display: inline-block; }
.tname { border: 0; background: none; text-align: left; cursor: pointer; padding: 3px 6px; border-radius: 8px; min-width: 0; }
.trow.art .tname { color: var(--art); } .trow.ven .tname { color: var(--ven); }
.trow.on .tname { background: color-mix(in srgb, var(--c2, var(--fg)) 10%, transparent); font-weight: 600; }
.tname small { color: var(--muted); }
.bdg { font-size: .75rem; }
.kidsline { font-size: .88rem; }
.mini { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 1px 9px; margin: 2px 0; cursor: pointer; font-size: .8rem; }
.qlist { display: flex; flex-direction: column; gap: 6px; }
.qitem { display: grid; text-align: left; border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 9px 12px; cursor: pointer; gap: 1px; }
.qitem small { color: var(--muted); font-size: .76rem; }
.qitem.on { border-color: var(--star); background: var(--star-soft); }
.cur.qa .src { font-size: .74rem; color: var(--muted); }
.cur.qa h2 { color: var(--fg); font-size: 1.05rem; }
.ans { font-weight: 600; color: color-mix(in srgb, #1f8a4c 80%, var(--fg)); }
</style>
</head>

      <g id="base">
        <path class="bodyfill" d="M182 108 L180 160 L150 166 L124 174 L112 190 L104 230 L86 330 L68 450 L60 470 L56 500 L62 520 L78 524 L96 518 L103 470 L104 450 L116 335 L136 250 L144 222 L146 260 L150 330 L146 400 L138 450 L138 470 L140 560 L142 625 L146 700 L148 760 L142 780 L140 800 L148 812 L170 812 L178 800 L178 760 L180 700 L183 625 L192 540 L198 494 L200 490 L202 494 L208 540 L217 625 L220 700 L222 760 L222 800 L230 812 L252 812 L260 800 L258 780 L252 760 L254 700 L258 625 L260 560 L262 470 L262 450 L254 400 L250 330 L254 260 L256 222 L264 250 L284 335 L296 450 L297 470 L304 518 L322 524 L338 520 L344 500 L340 470 L332 450 L314 330 L296 230 L288 190 L276 174 L250 166 L220 160 L218 108 Z"/>

<script>/* Damar ağacı. Koordinatlar ön görünüm, 400x820 tuval; hastanın sağı izleyicinin solunda (x<200).
   '*' ile biten id'ler iki taraflı şablondur: sağ (_d) olduğu gibi, sol (_s) x -> 400-x aynalanır. */
const RAW = [];
function A(id, name, parent, pts, o) { RAW.push(Object.assign({ id, name, parent, pts, t: 'A' }, o || {})); }
function V(id, name, parent, pts, o) { RAW.push(Object.assign({ id, name, parent, pts, t: 'V' }, o || {})); }

/* ======================= ARTERLER ======================= */
A('lv', 'Ventriculus sinister', null, [[238, 290], [215, 262]], { n: 'Sol ventrikül. Oksijenli kanı aortaya pompalar. Duvarı sağ ventrikülden 3 kat kalın.', root: 1 });
A('aao', 'Aorta ascendens', 'lv', [[206, 252], [200, 228], [201, 212]], { n: 'Mediastinum medius içinde. İlk dalları koroner arterler; sinus aortae (Valsalva) içinden çıkarlar.', l: ['perikard'] });
A('rca', 'A. coronaria dextra', 'aao', [[204, 248], [188, 254], [182, 270], [190, 290], [200, 296]], { n: 'Sağ sinus aortae\'den çıkar. Kalbin arka yüzü, sağ atriyum, sağ ventrikülün büyük kısmı ve ileti sisteminin çoğunu besler.', q: ['koroner2'] });
A('rca_coni', 'R. coni arteriosi', 'rca', [[194, 251], [200, 262]], { n: 'Sol koronerin aynı adlı dalıyla Vieussens halkasını yapar.' });
A('rca_sa', 'R. nodi sinoatrialis', 'rca', [[188, 254], [184, 240]], { n: 'SA düğümü besler (çoğunlukla sağ koronerden).' });
A('rca_marg', 'R. marginalis dexter', 'rca', [[183, 272], [196, 288]], { n: 'Kalbin alt kenarını besler. V. cordis parva buna eşlik eder.' });
A('rca_pl', 'R. posterolateralis dexter', 'rca', [[190, 290], [192, 298]], { d: 1 });
A('rca_ivp', 'R. interventricularis posterior', 'rca', [[200, 296], [222, 297], [236, 293]], { d: 1, n: '%70 kişide sağ koronerden (sağ dominans). Septumun arka-alt 1/3\'ünü besler, apekste LAD ile anastomoz yapar. V. cordis media eşlik eder.', q: ['koroner2'] });
A('rca_av', 'R. nodi atrioventricularis', 'rca', [[198, 295], [205, 285]], { d: 1, n: 'AV düğümü besler.' });
A('lca', 'A. coronaria sinistra', 'aao', [[210, 247], [222, 248]], { n: 'Sol sinus aortae\'den, aorta ascendens\'ten çıkar. Sağdan kalındır. Kalbin ön yüzünü, septumun ön 2/3\'ünü besler.', q: ['koroner1', 'koroner2'] });
A('lad', 'R. interventricularis anterior (LAD)', 'lca', [[222, 248], [227, 266], [238, 292]], { n: 'Sulcus interventricularis anterior\'da apekse iner. V. cordis magna eşlik eder. Dalları: rr. diagonales, rr. septales.', q: ['koroner2'] });
A('lad_diag', 'Rr. laterales (diagonales)', 'lad', [[226, 262], [240, 268]]);
A('lad_sept', 'Rr. interventriculares septales', 'lad', [[228, 272], [222, 280]]);
A('lcx', 'R. circumflexus', 'lca', [[222, 248], [240, 252], [248, 266]], { n: 'Sulcus coronarius\'ta sola ve arkaya döner.' });
A('lcx_marg', 'R. marginalis sinister', 'lcx', [[244, 258], [246, 280]]);
A('lcx_post', 'R. ventriculi sinistri posterior', 'lcx', [[248, 266], [244, 284]], { d: 1 });

A('arc', 'Arcus aortae', 'aao', [[201, 212], [208, 200], [222, 199], [230, 210]], { n: '2. kosta hizasında başlar. Dalları sağdan sola: truncus brachiocephalicus, a. carotis communis sinistra, a. subclavia sinistra. Duvarında baroreseptörler (n. vagus) ve glomera aortica (kemoreseptör) var.', l: ['arcus'] });
A('tbc', 'Truncus brachiocephalicus', 'arc', [[205, 204], [196, 190], [188, 180]], { n: 'Arcus\'un ilk ve en büyük dalı. Art. sternoclavicularis arkasında sağ subclavia ve sağ carotis communis\'e ayrılır.' });
A('cc_d', 'A. carotis communis dextra', 'tbc', [[188, 180], [184, 152], [182, 128]], { side: 'd', n: 'Truncus brachiocephalicus\'tan çıkar. Vagina carotica içinde, C4 hizasında ikiye ayrılır.', l: ['vagcar', 'bifur'] });
A('cc_s', 'A. carotis communis sinistra', 'arc', [[214, 199], [216, 152], [218, 128]], { side: 's', n: 'Doğrudan arcus aortae\'den çıkar. C4 hizasında ikiye ayrılır.', l: ['vagcar', 'bifur'] });
A('sc_d', 'A. subclavia dextra', 'tbc', [[188, 180], [170, 174], [150, 176], [136, 188]], { side: 'd', n: 'Truncus brachiocephalicus\'tan çıkar. M. scalenus anterior onu 3 bölüme ayırır. 1. kostanın dış kenarında a. axillaris olur. Dalları: VIT C D.', l: ['scalen'], q: ['ti_kan'] });
A('sc_s', 'A. subclavia sinistra', 'arc', [[226, 203], [232, 182], [250, 176], [264, 188]], { side: 's', n: 'Doğrudan arcus aortae\'den çıkar. M. scalenus anterior onu 3 bölüme ayırır. 1. kostanın dış kenarında a. axillaris olur.', l: ['scalen'] });

/* ---- Carotis communis şablonu ---- */
A('ica*', 'A. carotis interna', 'cc*', [[182, 128], [181, 106], [185, 86], [188, 72]], { n: 'Boyun kısmı (pars cervicalis) DAL VERMEZ. Canalis caroticus\'tan kafa içine girer, sinus cavernosus içinden geçer (pars cavernosa). Kafa içi dalları: ophthalmica, cerebri anterior, cerebri media, communicans posterior. Başlangıcındaki genişleme sinus caroticus (baroreseptör, n. IX).', l: ['bifur', 'cavern'], q: ['eca1', 'eca3', 'burun1'] });

<script>(function () {
'use strict';
/* ---------- veri genişletme ---------- */
const N = {};          // id -> node
const ORDER = [];
const mir = p => [400 - p[0], p[1]];
RAW.forEach(r => {
  if (r.id.endsWith('*')) {
    ['d', 's'].forEach(side => {
      const id = r.id.slice(0, -1) + '_' + side;
      const parent = r.parent && r.parent.endsWith('*') ? r.parent.slice(0, -1) + '_' + side : r.parent;
      const link = r.link ? r.link.slice(0, -1) + '_' + side : null;
      const pts = side === 'd' ? r.pts : r.pts.map(mir);
      N[id] = Object.assign({}, r, { id, parent, pts, side, link });
      ORDER.push(id);
    });
  } else {
    N[r.id] = Object.assign({}, r);
    ORDER.push(r.id);
  }
});
ORDER.forEach(id => { N[id].kids = []; });
ORDER.forEach(id => { const n = N[id]; if (n.parent && N[n.parent]) N[n.parent].kids.push(id); });
function depth(id) { let d = 0, n = N[id]; while (n.parent) { d++; n = N[n.parent]; } return d; }
ORDER.forEach(id => { N[id].dp = depth(id); });
function anc(id) { const a = []; let n = N[id]; while (n) { a.unshift(n.id); n = n.parent ? N[n.parent] : null; } return a; }
function sub(id, acc) { acc = acc || []; acc.push(id); N[id].kids.forEach(k => sub(k, acc)); return acc; }
const LM = {}; LANDMARKS.forEach(l => { LM[l.id] = l; });
const QZ = {}; CIKMIS.forEach(q => { QZ[q.id] = q; });
// çıkmış bağlantıları: düğümdeki q + soruların damar listesi
ORDER.forEach(id => { N[id].qs = new Set(N[id].q || []); });

function sideTag(n) { return n.side === 'd' ? 'sağ' : n.side === 's' ? 'sol' : ''; }
function nm(id) { const n = N[id]; return n.name + (n.side ? ` (${sideTag(n)})` : ''); }
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ---------- SVG ---------- */
const svg = document.getElementById('fig');
const gVes = document.getElementById('ves');
const gTop = document.getElementById('top');
const gLab = document.getElementById('lab');
function dOf(n) {
  const p = n.pts;
  if (n.seg) { let s = ''; for (let i = 0; i + 1 < p.length; i += 2) s += `M${p[i][0]} ${p[i][1]}L${p[i + 1][0]} ${p[i + 1][1]}`; return s; }
  return 'M' + p.map(q => q.join(' ')).join('L');
}
function widthOf(n) { return Math.max(1.1, 5.2 - n.dp * 0.75); }
const EL = {};
ORDER.forEach(id => {
  const n = N[id];
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  g.setAttribute('class', 'v ' + (n.t === 'A' ? 'art' : 'ven') + (n.d ? ' deep' : ''));
  g.dataset.id = id;
  const hit = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  hit.setAttribute('d', dOf(n)); hit.setAttribute('class', 'hit');
  const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  p.setAttribute('d', dOf(n)); p.setAttribute('class', 'ln');
  p.style.setProperty('--w', widthOf(n));
  g.appendChild(hit); g.appendChild(p);
  gVes.appendChild(g);
  EL[id] = g;
  g.addEventListener('click', e => { e.stopPropagation(); onFigClick(id); });
});

const FULL = [0, 0, 400, 820];

  anim = requestAnimationFrame(step);
}
function boxOf(ids, pad, minW) {

/* ---------- yolculuk ---------- */
function rootsOf(t) { return t === 'A' ? ['lv', 'rv'] : ['ra', 'la']; }
