<style>
:root{--bg:#fbfcfe;--fg:#1f2633;--muted:#5d6779;--line:#e3e7ef;--card:#fff;--soft:#f2f4f9;
 --ok:#1f8a4c;--ok-soft:#e8f6ee;--no:#c8323c;--no-soft:#fdeeee;--sel:#2a5bd7;--sel-soft:#ebf0fd;
 --A:#0f7f7a;--A-soft:#e4f5f4;--D:#a86b00;--D-soft:#fdf5e0;--Y:#8a37b8;--Y-soft:#f5ecfa}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--fg:#e6e9f0;--muted:#a2abbb;--line:#2a303c;--card:#181c25;--soft:#1f2430;
 --ok:#6fd69a;--ok-soft:#16301f;--no:#ff8a8f;--no-soft:#3a1d21;--sel:#8eaeff;--sel-soft:#1a2440;
 --A:#5fd3cb;--A-soft:#122f2e;--D:#f5c45a;--D-soft:#352b14;--Y:#d29af2;--Y-soft:#2f1f3a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12151c;--fg:#e6e9f0;--muted:#a2abbb;--line:#2a303c;--card:#181c25;--soft:#1f2430;
 --ok:#6fd69a;--ok-soft:#16301f;--no:#ff8a8f;--no-soft:#3a1d21;--sel:#8eaeff;--sel-soft:#1a2440;
 --A:#5fd3cb;--A-soft:#122f2e;--D:#f5c45a;--D-soft:#352b14;--Y:#d29af2;--Y-soft:#2f1f3a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Lexend","Segoe UI",system-ui,sans-serif;font-weight:300;font-size:17px;line-height:1.65;
 padding:0 max(16px,env(safe-area-inset-right,0px)) 120px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:720px;margin:0 auto}
header{padding-block:44px 8px}
h1{font-size:1.9rem;font-weight:600;line-height:1.25;margin:0 0 8px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 14px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 16px}
.tabs button{font:inherit;font-weight:500;font-size:.95rem;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:7px 16px;border-radius:999px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tabs button:focus-visible{outline:3px solid var(--sel);outline-offset:2px}
.legend{display:flex;flex-wrap:wrap;gap:8px;font-size:.85rem}
.tag{display:inline-block;border-radius:999px;padding:1px 10px;font-size:.78rem;font-weight:500;white-space:nowrap}
.tag.A{background:var(--A-soft);color:var(--A)} .tag.D{background:var(--D-soft);color:var(--D)} .tag.Y{background:var(--Y-soft);color:var(--Y)}
h2{font-size:1.4rem;font-weight:600;margin:48px 0 4px}
.dsub{color:var(--muted);font-size:.9rem;margin:0 0 8px}
.q{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 18px 14px;margin:14px 0}
.qh{display:flex;gap:8px;align-items:baseline;margin-bottom:8px}
.num{font-weight:600;color:var(--muted);font-size:.9rem;min-width:2ch}
.stem{font-weight:400;margin:0}
.rom{display:grid;gap:2px;margin-top:8px;font-size:.95rem}
.opts{display:grid;gap:6px;margin-top:10px}
.opt{font:inherit;font-size:.96rem;text-align:left;line-height:1.45;background:var(--soft);color:var(--fg);border:1.5px solid transparent;border-radius:12px;padding:9px 12px;cursor:pointer;display:flex;gap:10px}
.opt b{font-weight:600;min-width:1.2em}
.opt:hover{border-color:var(--line)}
.opt:focus-visible{outline:3px solid var(--sel);outline-offset:2px}
.opt[aria-pressed="true"]{background:var(--sel-soft);border-color:var(--sel)}
.done .opt{cursor:default}
.done .opt.right{background:var(--ok-soft);border-color:var(--ok);color:var(--fg)}
.done .opt.wrong{background:var(--no-soft);border-color:var(--no)}
.fb{display:none;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);font-size:.93rem}
.done .fb{display:block}
.fb .res{font-weight:600;margin-right:6px}
.fb .res.ok{color:var(--ok)} .fb .res.no{color:var(--no)} .fb .res.skip{color:var(--muted)}
.fb .src{color:var(--muted);font-size:.85rem;margin:6px 0}
.fb p{margin:6px 0 0} .fb strong{font-weight:600}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);
 padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:5}
.bar .in{max-width:720px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar .cnt{color:var(--muted);font-size:.9rem;margin-right:auto}
.btn{font:inherit;font-weight:500;font-size:.95rem;border-radius:999px;padding:9px 18px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
.btn.pri{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn:focus-visible{outline:3px solid var(--sel);outline-offset:2px}
.score{display:none;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin:24px 0}
.score.show{display:block}
.big{font-size:2.2rem;font-weight:600;line-height:1.1}
.rows{display:grid;gap:8px;margin-top:14px}
.row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;font-size:.95rem}
.meter{grid-column:1/-1;height:8px;border-radius:999px;background:var(--soft);overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok);border-radius:999px}
.note{color:var(--muted);font-size:.88rem;margin:14px 0 0}
.filter{display:none;gap:8px;flex-wrap:wrap;margin-top:14px}
.score.show .filter{display:flex}
.btn.sm{padding:5px 12px;font-size:.85rem}
.btn[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.q[hidden]{display:none}
@media (max-width:480px){body{font-size:16px}h1{font-size:1.55rem}.q{padding:14px}}

<script>
var SETS = [{"id": "d1", "key": "deneme-v1", "tab": "Deneme 1", "title": "Deneme 1", "intro": "45 soru, bu yılın dağılımıyla: histoloji 7, anatomi 8, biyokimya 8, fizyoloji 22. Soruların yaklaşık %60'ı çıkmış (yarısı aynen, yarısı değiştirilmiş), kalanı slaytlardan potansiyel sorular.", "qs": [{"d": "Histoloji", "t": "A", "src": "Online · 2025", "q": "Foramen ovale hangi yapı üzerinde yer alır?", "o": ["Septum primum", "Septum secundum", "Septum spurium", "Müsküler interventriküler septum", "Membranöz interventriküler septum"], "a": 1, "e": "Foramen ovale kalın, kaslı <strong>septum secundum</strong>'daki açıklıktır. İsim tuzağı: foramen <strong>secundum</strong> ise septum <strong>primum</strong>'dadır."}, {"d": "Histoloji", "t": "D", "src": "Asıl soru: \"Koroner sinüs neden gelişir?\" (2K1 · 2025) + \"Sol boynuzdan ne gelişir?\" (2024)", "q": "Sol sinüs boynuzundan erişkinde geriye kalan yapılar hangileridir?", "o": ["Koroner sinüs ve sol atriyumun oblik veni", "Sinüs venarum ve crista terminalis", "VCI'nın hepatik segmenti ve portal ven", "Septum spurium ve fossa ovalis", "Sol pulmoner venler ve sol kulakçık"], "a": 0, "e": "Sol umbilikal, sol vitellin ve sonra sol ana kardinal ven tıkanınca sol boynuzdan yalnızca <strong>koroner sinüs</strong> ve <strong>sol atriyumun oblik veni</strong> kalır. Sinüs venarum ve crista terminalis <strong>sağ</strong> boynuzla ilgilidir."}, {"d": "Histoloji", "t": "D", "src": "Asıl soru: \"Lenfatik kapiller olmayan doku → kemik iliği\" (2K1); burada tersine çevrildi", "q": "Aşağıdaki dokulardan hangisinde lenfatik kapiller BULUNUR?", "o": ["Kıkırdak", "Merkezi sinir sistemi", "Plasenta", "Kemik iliği", "Deri dermisi"], "a": 4, "e": "Slayt: lenfatik kapillerler dokuların çoğunda var, ama <strong>kıkırdak, kemik, epitel, MSS, kemik iliği ve plasentada yoktur</strong>. Dermis gevşek bağ dokusudur, lenfatikten zengindir."}, {"d": "Histoloji", "t": "A", "src": "2K1 · 2024", "q": "Kalp doku kesitinde Purkinje lifleri nerede gözlenebilir?", "o": ["İnteratriyal septum subendokardiyumunda", "İnterventriküler septum subendokardiyumunda", "Sol atriyum miyokardiyumunda", "Sağ atriyum miyokardiyumunda", "Kalbin fibröz iskeleti boyunca"], "a": 1, "e": "Purkinje lifleri <strong>subendokardiyal</strong> bağ dokuda, interventriküler septum boyunca ventriküllere dağılır. Çizgilidirler ve tipik olmayan interkalar disklerle bağlanırlar."}, {"d": "Histoloji", "t": "D", "src": "Asıl soru: \"Fetal damarlar ve doğum sonrası karşılıkları\" (2023); şıklar slayttaki akıbet tablosundan yenilendi", "q": "Fetal damarlar ve doğum sonrası karşılıkları hangi şıkta doğru eşleştirilmiştir?", "o": ["Ductus venosus – Lig. teres hepatis", "Umbilikal arterin distal parçası – Lig. umbilicale mediale", "Ductus arteriosus – Lig. venosum", "Vitellin arter – A. vertebralis", "Sol vitellin ven – Vena cava inferior"], "a": 1, "e": "Umbilikal arterin <strong>distali → lig. umbilicale mediale</strong>, proksimali → a. iliaca interna ve a. vesicalis superior. Ductus venosus → lig. venosum, ductus arteriosus → lig. arteriosum, vitellin arterler → çölyak/SMA/IMA, sol vitellin ven → portal ven."}, {"d": "Histoloji", "t": "Y", "src": "Slayt: Aortik arklar (yıldızlı, hiç sorulmamış)", "q": "Sol 6. aortik arktan aşağıdakilerden hangisi gelişir?", "o": ["Arcus aortae", "Sağ a. subclavia'nın proksimali", "A. carotis communis", "Ductus arteriosus", "A. maxillaris"], "a": 3, "e": "6. ark: sağda sağ pulmoner arter, <strong>solda sol pulmoner arter ve ductus arteriosus</strong>. Sol 4. ark arcus aortae, sağ 4. ark sağ subclavia proksimali, 3. ark carotis communis, 1. ark maksiller arter."}, {"d": "Histoloji", "t": "Y", "src": "Slayt: Kan doku, çalışma sorusu 4", "q": "Pıhtılaşmış kanın sıvı kısmı olan serumu plazmadan ayıran temel özellik hangisidir?", "o": ["Albümin içermemesi", "Fibrinojen içermemesi", "Glukoz içermemesi", "İmmünglobulin içermemesi", "Elektrolit içermemesi"], "a": 1, "e": "Antikoagülan yokken fibrinojen pıhtıya katılır; geriye kalan sıvı <strong>serum</strong>dur ve <strong>fibrinojen içermez</strong>."}, {"d": "Anatomi", "t": "A", "src": "2023 · 2025", "q": "Aşağıdakilerden hangisi \"sinus transversus pericardii\"nin geçiş yeridir?", "o": ["Aorta ve truncus pulmonalis arasından", "Vena cava superior ve inferior arasından", "Vagina serosum venosum'un altından", "Vagina caroticum'un altından", "Vagina serosum venosum ve vagina serosum arteriosum arasından"], "a": 4, "e": "Transversus = arteriyel ve venöz seröz kılıfların <strong>arasından</strong> geçen kanal. \"Venosum'un altından\" sinus <strong>obliquus</strong>'tur. Aorta–truncus \"arasından\" değil, <strong>arkasından</strong>."}, {"d": "Anatomi", "t": "A", "src": "2K1 · 2024", "q": "Aşağıdaki seçeneklerden hangisi tamamı arteria carotis externa'nın dallarından oluşur?<span class=\"rom\"><span>I- A. vertebralis</span><span>II- A. maxillaris</span><span>III- A. pharyngea ascendens</span><span>IV- A. thyroidea inferior</span><span>V- A. thyroidea superior</span></span>", "o": ["I, II, III", "I, III, IV", "II, III, V", "II, IV, V", "III, IV, V"], "a": 2, "e": "Vertebralis ve thyroidea inferior <strong>a. subclavia</strong> sistemindendir (truncus thyrocervicalis). Kalanlar ECA: maxillaris, pharyngea ascendens, thyroidea superior."}, {"d": "Anatomi", "t": "D", "src": "Asıl soru: sağ v. intercostalis posterior (Online · 2025) ve sol anterior (2023 · 2K1); şıklar aynı", "q": "Aşağıdakilerden hangisi sol tarafta bulunan vena intercostalis posterior'ların drene olduğu vendir?", "o": ["Vena thoracica interna", "Vena subclavia", "Vena hemiazygos", "Vena azygos", "Vena cava inferior"], "a": 2, "e": "Arka sağ → <strong>azygos</strong>, arka sol → <strong>hemiazygos</strong> (oradan azygos'a). Ön interkostal venler iki tarafta da → <strong>v. thoracica interna</strong>."}, {"d": "Anatomi", "t": "A", "src": "2F1 · 2025", "q": "Aşağıdakilerden hangisi arteria thoracica interna tarafından kanlandırılmaz?", "o": ["Thymus", "Sternum", "Diaphragma thoracoabdominalis", "Oesophagus", "Pericardium fibrosum"], "a": 3, "e": "Özofagusun boyun kısmını <strong>a. thyroidea inferior</strong>, torakal kısmını aortanın özofageal dalları besler."}, {"d": "Anatomi", "t": "D", "src": "Asıl soru: üç aksiller aralık (2023 · 2F1 · 2K1); bu kez arter soruluyor", "q": "Aşağıdaki arterlerden hangisi spatium triangulare inferior (triseps açıklığı)'dan geçer?", "o": ["A. circumflexa humeri anterior", "A. circumflexa humeri posterior", "A. circumflexa scapulae", "A. profunda brachii", "A. thoracodorsalis"], "a": 3, "e": "Triseps açıklığı: <strong>n. radialis + a. profunda brachii</strong>. Dörtgen: n. axillaris + a. circumflexa humeri posterior. Üst üçgen: a. circumflexa scapulae."}, {"d": "Anatomi", "t": "A", "src": "2F1 · Derleme", "q": "Aşağıdaki nörovasküler yapılardan hangisi foramen infrapiriforme'den geçmez?", "o": ["Arteria glutea inferior", "Nervus cutaneus femoris posterior", "Nervus ischiadicus", "Arteria pudenda interna", "Arteria obturatoria"], "a": 4, "e": "A. obturatoria <strong>canalis obturatorius</strong>'tan uyluğun medial kompartmanına gider. İnfrapiriforme = POPS IQ."}, {"d": "Anatomi", "t": "D", "src": "Asıl soru: diafram \"doğru değil\" (2023 · Online · 2K1 · 2025); doğru eşleştirme olarak çevrildi", "q": "Diafram açıklıkları ile ilgili hangi eşleştirme doğrudur?", "o": ["Foramen venae cavae – T10", "Hiatus oesophageus – T12", "Hiatus aorticus – T12 – ductus thoracicus", "Hiatus aorticus – T10 – n. vagus", "Foramen venae cavae – T12 – n. phrenicus dexter"], "a": 2, "e": "<strong>T8 VCI, T10 özofagus (+ vagus), T12 aorta (+ ductus thoracicus, v. azygos).</strong>"}, {"d": "Anatomi", "t": "Y", "src": "Slayt: a. femoralis dalları (çıkmışlarda dal listeleri hep soruluyor)", "q": "Aşağıdakilerden hangisi arteria profunda femoris'in dalı DEĞİLDİR?", "o": ["A. circumflexa femoris medialis", "A. circumflexa femoris lateralis", "Aa. perforantes", "A. descendens genus", "R. descendens (a. circumflexa femoris lateralis)"], "a": 3, "e": "A. descendens genus doğrudan <strong>a. femoralis</strong>'ten, canalis adductorius'ta çıkar. \"Poplitea'ya ait değil\" sorusunun da cevabıydı."}, {"d": "Biyokimya", "t": "A", "src": "2023", "q": "Aşağıdakilerden hangisi ksenobiyotik metabolizmasının faz 2 reaksiyonlarındandır?", "o": ["Aromatik hidroksilasyon", "O-dealkilasyon", "Alifatik oksidasyon", "Glukuronidasyon", "Hidroliz"], "a": 3, "e": "Faz II = konjugasyon: glukuronidasyon, asetilasyon, metilasyon, sülfatasyon, glutatyon. Diğerleri faz I."}, {"d": "Biyokimya", "t": "A", "src": "2K1", "q": "Hem yıkımındaki hız kısıtlayıcı basamağı katalizleyen enzim hangisidir?", "o": ["ALA sentaz", "Biliverdin redüktaz", "Ferroşelataz", "Hem oksijenaz", "UDP-glukuroniltransferaz"], "a": 3, "e": "Yıkımda <strong>hem oksijenaz</strong>, sentezde <strong>ALA sentaz</strong> hız kısıtlayıcıdır."}, {"d": "Biyokimya", "t": "D", "src": "Asıl soru: \"Monomerik, O₂ depolayan hem proteini\" (Online) ve \"kuarterner yapı\" (2K1)", "q": "Oksijen bağlama (satürasyon) eğrisi hiperbolik olan hemoprotein hangisidir?", "o": ["Hemoglobin A", "Miyoglobin", "Hemoglobin F", "Katalaz", "Sitokrom c"], "a": 1, "e": "<strong>Miyoglobin</strong> monomerdir, kooperatif bağlanma yok → <strong>hiperbolik</strong> eğri. Hemoglobin tetramerdir, kooperatiflik → <strong>sigmoid</strong>."}, {"d": "Biyokimya", "t": "D", "src": "Asıl soru: \"Bilirubini HÜCRE İÇİNDE taşıyan protein → ligandin\" (Online); şıklar aynı, yer değişti", "q": "Hem yıkım ürünü bilirubini KANDA (plazmada) taşıyan protein hangisidir?", "o": ["Albümin", "Adrenodoksin", "Globin", "Ligandin", "UDP"], "a": 0, "e": "Kanda <strong>albümin</strong>, hepatosit içinde <strong>ligandin</strong>. Albüminden ayrılan bilirubin hepatosite girer."}, {"d": "Biyokimya", "t": "Y", "src": "Slayt konusu: hem sentezi (2024'te \"ortama ne eklenmeli\" soruldu)", "q": "Hem sentezinin ilk basamağını katalizleyen ALA sentaz için gerekli koenzim hangisidir?", "o": ["Tiamin pirofosfat", "Biotin", "Piridoksal fosfat", "FAD", "Koenzim A"], "a": 2, "e": "Glisin + süksinil-CoA → ALA; enzim <strong>ALA sentaz</strong>, koenzimi <strong>piridoksal fosfat (B6)</strong>. Mitokondride olur."}, {"d": "Biyokimya", "t": "Y", "src": "Slayt konusu: bilirubin metabolizması", "q": "Bilirubinin hepatositte konjugasyonunu katalizleyen enzim hangisidir?", "o": ["Biliverdin redüktaz", "Hem oksijenaz", "UDP-glukuroniltransferaz", "β-glukuronidaz", "Ferroşelataz"], "a": 2, "e": "<strong>UDP-glukuroniltransferaz</strong> bilirubine iki glukuronik asit ekler (bilirubin diglukuronid). Faz II glukuronidasyonun bilirubin örneği."}, {"d": "Biyokimya", "t": "Y", "src": "Slayt konusu: sitokrom P450", "q": "Sitokrom P450 enzimleri temel olarak hangi tip reaksiyonu katalizler?", "o": ["Dioksijenaz", "Monooksijenaz (karma fonksiyonlu oksidaz)", "Hidrolaz", "Transferaz", "Liyaz"], "a": 1, "e": "P450: O₂'nin bir atomu substrata (R-OH), diğeri suya gider → <strong>monooksijenaz</strong>. NADPH ve P450 redüktaz gerekir."}, {"d": "Biyokimya", "t": "Y", "src": "Slayt konusu: hem yıkımı", "q": "Hem oksijenaz reaksiyonu sırasında açığa çıkan gaz hangisidir?", "o": ["CO₂", "Karbon monoksit (CO)", "Nitrik oksit (NO)", "H₂S", "O₂"], "a": 1, "e": "Hem → biliverdin + <strong>Fe²⁺</strong> + <strong>CO</strong>. Vücutta endojen CO'nun ana kaynağıdır."}, {"d": "Fizyoloji", "t": "A", "src": "2023 · Online · 2K1 · Derleme", "q": "Kalpte pacemaker hücrelerinde stabil olmayan dinlenim potansiyeli, hücrelerin kendi kendine eşik değeri aşarak depolarize olmasını sağlar. Yavaşça artan bu potansiyelin adı nedir, temel nedeni hangi kanal açılımıdır?", "o": ["Yavaş cevap aksiyon potansiyeli, transient kalsiyum kanalları", "Spontan diyastolik depolarizasyon, potasyum kanalları", "Pace-maker potansiyel, K⁺ kanalları", "Spontan diyastolik depolarizasyon, funny Na⁺ kanalları", "Yavaş cevap aksiyon potansiyeli, uzun süreli açık kalan kalsiyum kanalları"], "a": 3, "e": "Faz 4'teki yavaş yükseliş = <strong>spontan diyastolik depolarizasyon</strong>, sorumlusu <strong>funny (If) Na⁺</strong> akımı. Dört sınavda kelimesi kelimesine aynı."}, {"d": "Fizyoloji", "t": "A", "src": "2023 · Online · 2K1", "q": "Aşağıdakilerden hangisi kan basıncının akut dönemde regülasyonunda görev almaz?", "o": ["MSS'nin iskemik yanıtı", "Böbreklerin kan basıncını düzenleyici etkisi", "Kardiyopulmoner reseptörler", "Kemoreseptör refleksler", "Baroreseptör refleksler"], "a": 1, "e": "Böbrek–vücut sıvısı sistemi <strong>uzun dönem</strong> kontroldür (saatler–günler). Diğerleri saniyeler içinde çalışan sinirsel reflekslerdir."}, {"d": "Fizyoloji", "t": "A", "src": "2023 · 2K1", "q": "RR intervali 15 mm, kâğıt hızı 25 mm/s. Hastanın kalp hızı ne kadardır?", "o": ["90 atım/dk", "80 atım/dk", "75 atım/dk", "100 atım/dk", "120 atım/dk"], "a": 3, "e": "<strong>1500 ÷ 15 = 100.</strong> (15 × 0,04 s = 0,6 s; 60 ÷ 0,6 = 100.)"}, {"d": "Fizyoloji", "t": "A", "src": "2023 · Derleme", "q": "Kalbe ait hacim–basınç döngüsünde mitral kapağın açılması ile kardiyak döngünün hangi fazı başlar?", "o": ["İzovolümetrik kasılma", "Hızlı ejeksiyon", "Yavaş ejeksiyon", "İzovolümetrik gevşeme", "Doluş fazı"], "a": 4, "e": "Mitral açılır → <strong>hızlı doluş</strong> (S3 bu sırada). Mitral kapanır → izovolümetrik kasılma (S1)."}, {"d": "Fizyoloji", "t": "A", "src": "2F1 · 2024", "q": "Dolaşımın humoral düzenlenmesinde aşağıdakilerden hangisi vazokonstriktör etkiye sahip bir etkendir?", "o": ["CO₂ artışı", "Adenozin varlığı", "Nitrik oksit miktarındaki artış", "Asiditenin artışı", "Endotelin-1"], "a": 4, "e": "CO₂, adenozin, NO, H⁺ lokal <strong>dilatatörlerdir</strong>. Endotelin-1 en güçlü vazokonstriktörlerden."}, {"d": "Fizyoloji", "t": "A", "src": "2F1 · 2024 · Derleme", "q": "Kalp kasında fizyolojik durumda tetani görülmemesinin nedeni hangisidir?", "o": ["Refrakter periyod süresinin uzunluğu", "Sinsisyum özelliği", "İnterkale disklerin varlığı", "Diad yapısı", "İyon kanallarının yapısı"], "a": 0, "e": "Refrakter periyot (~250 ms) kasılma süresi kadar uzun; yeni uyarı kasılma bitmeden toplanamaz."}, {"d": "Fizyoloji", "t": "D", "src": "Asıl soru: -tropi çiftleri (2023 · Online · 2K1 · 2024); bu kez yeni çift", "q": "\"−İnotropi\" ve \"+Batmotropi\" sırasıyla ne anlama gelmektedir?", "o": ["Kalp hızının azalması ve ileti hızının artması", "Kasılma gücünün azalması ve uyarılabilirliğin artması", "Gevşeme hızının azalması ve kasılma gücünün artması", "Atım hacminin azalması ve kalp hızının artması", "İleti hızının azalması ve uyarılabilirliğin azalması"], "a": 1, "e": "Krono = hız, <strong>ino = kasılma gücü</strong>, dromo = ileti, lusi = gevşeme, <strong>batmo = uyarılabilirlik</strong>."}, {"d": "Fizyoloji", "t": "D", "src": "Asıl soru: Starling hesapları (2F1: filtrasyon 5 · 2K1: filtrasyon 11); bu kez venöz uç", "q": "Bir kapillerin venöz ucunda kapiller hidrostatik basınç 15 mmHg, interstisyel sıvı basıncı 1 mmHg, plazma onkotik basıncı 25 mmHg, interstisyel onkotik basınç 3 mmHg'dır. Sıvı hareketinin yönü ve net gücü nedir?", "o": ["Filtrasyon; 8 mmHg", "Absorbsiyon; 8 mmHg", "Absorbsiyon; 6 mmHg", "Filtrasyon; 4 mmHg", "Net sıvı hareketi yoktur"], "a": 1, "e": "(Pc − Pif) − (πc − πif) = (15 − 1) − (25 − 3) = 14 − 22 = <strong>−8 → absorbsiyon</strong>."}, {"d": "Fizyoloji", "t": "D", "src": "Asıl soru: EKG aks tanımı (2F1 · 2K1 · Derleme); şıklar aynı, şekil değişti", "q": "Bir hastanın EKG'sinde DI derivasyonunda QRS belirgin negatif, aVF'de belirgin pozitiftir. Kardiyak aks için doğru tanım hangisidir?", "o": ["Aks; +90 ve +180 derece arası olup sağ alt kadrana denk gelir (sağ aks sapması)", "Aks; −90 ve −180 derece arasında olup şiddetli aks sapmasını düşündürür", "Aks; −30 ve −90 derece arasında olup sol aks deviasyonunu gösterir", "Aks; 0 ve +90 derece arasında olup normal akstır", "Aks; −30 ve 0 derece arasında olup normal varyanttır"], "a": 0, "e": "DI − / aVF + → <strong>sağ aks</strong> (+90 ile +180). DI + / aVF + normal, DI + / aVF − sol, ikisi de − aşırı sapma."}, {"d": "Fizyoloji", "t": "D", "src": "Asıl soru: EDV (2F1) ve atım hacmi (2K1); şıklar aynı, üçüncü hacim", "q": "Dinlenim halindeki sağlıklı bir erişkinde sol ventrikül sistol sonu hacmi yaklaşık ne kadardır?", "o": ["50 ml", "70 ml", "120 ml", "25 ml", "40 ml"], "a": 0, "e": "<strong>EDV 120 − SV 70 = ESV 50 ml.</strong> EF ≈ %58–60."}, {"d": "Fizyoloji", "t": "D", "src": "Asıl soru: aort yetmezliği üfürümü (2023 · 2K1); 2024'te stenoz olarak soruldu", "q": "Aort stenozunda üfürüm hangi fazda ve göğüs kafesinde hangi lokalizasyonda duyulur?", "o": ["Sistol sırasında, sol ikinci interkostal aralığın sternumla birleşim bölgesinde", "Diyastol sırasında, sol ikinci interkostal aralığın sternumla birleşim bölgesinde", "Sistol sırasında, sağ ikinci interkostal aralığın sternumla birleşim bölgesinde", "Diyastol sırasında, sağ ikinci interkostal aralığın sternumla birleşim bölgesinde", "Sistol sırasında, kalbin apeks bölgesinde"], "a": 2, "e": "Stenoz = kapak <strong>açıkken</strong> zorlanır; aort sistolde açık → <strong>sistolik</strong>. Yer: <strong>aort odağı, sağ 2. ICS</strong>. Sol 2. ICS pulmoner odaktır."}, {"d": "Fizyoloji", "t": "D", "src": "Asıl soru: \"S1'in EKG'deki zamanlaması → QRS hemen sonrası\" (2023 · Derleme); şıklar aynı, S2 soruldu", "q": "İkinci kalp sesinin zamanlaması EKG kaydında hangi döneme denk gelir?", "o": ["P dalgası sonu", "PR aralığı sonrası", "QRS dalgası hemen sonrası", "T dalgasının başı", "T dalgasının sonu"], "a": 4, "e": "T dalgası ventrikül repolarizasyonu; bitişinde ventrikül gevşer, basınç aortun altına düşer, <strong>aort kapağı kapanır → S2</strong>."}, {"d": "Fizyoloji", "t": "Y", "src": "Slayt: kalp döngüsü ve kalp hızı", "q": "Kalp hızı arttığında kardiyak döngünün en çok kısalan bölümü hangisidir?", "o": ["İzovolümetrik kasılma", "Hızlı ejeksiyon", "Diyastol (özellikle diyastazis)", "Atriyal sistol", "Aksiyon potansiyelinin faz 0'ı"], "a": 2, "e": "Taşikardide sistol de kısalır ama asıl kısalan <strong>diyastol</strong>dur; önce diyastazis kaybolur. Bu yüzden çok yüksek hızda doluş ve koroner akım bozulur."}, {"d": "Fizyoloji", "t": "Y", "src": "Slayt: elektrolitlerin EKG'ye etkisi (2025'te hipokalemi–QT soruldu)", "q": "Hiperkalemide EKG'de ilk görülen tipik bulgu hangisidir?", "o": ["U dalgası belirginleşmesi", "Sivri, uzun T dalgası", "ST depresyonu", "QT uzaması", "P dalgasının büyümesi"], "a": 1, "e": "Hiperkalemi → <strong>sivri T</strong>, sonra P kaybı ve QRS genişlemesi. Hipokalemi → düz T, <strong>belirgin U</strong>, QT(U) uzaması."}, {"d": "Fizyoloji", "t": "Y", "src": "Slayt: kalp debisi", "q": "Kalp hızı 75/dk ve atım hacmi 80 ml olan bir kişinin kalp debisi yaklaşık ne kadardır?", "o": ["4,0 L/dk", "5,0 L/dk", "6,0 L/dk", "7,5 L/dk", "8,0 L/dk"], "a": 2, "e": "Debi = KH × SV = 75 × 80 = 6000 ml/dk = <strong>6 L/dk</strong>."}, {"d": "Fizyoloji", "t": "Y", "src": "Slayt: ortalama arter basıncı (derlemede 120/90 soruldu)", "q": "Kan basıncı 120/80 mmHg olan bir kişinin ortalama arter basıncı yaklaşık kaç mmHg'dır?", "o": ["80", "93", "100", "105", "110"], "a": 1, "e": "OAB ≈ diyastolik + nabız basıncı/3 = 80 + 40/3 ≈ <strong>93 mmHg</strong>."}, {"d": "Fizyoloji", "t": "Y", "src": "Slayt: Laplace yasası", "q": "Laplace yasasına göre, aynı iç basınçta yarıçapı artmış (dilate) bir ventrikülde duvar gerimi nasıl değişir?", "o": ["Azalır", "Artar", "Değişmez", "Önce artar sonra azalır", "Duvar kalınlığından bağımsız olarak sıfırlanır"], "a": 1, "e": "T = P × r / (2h). Yarıçap artınca <strong>duvar gerimi artar</strong>; dilate kalp aynı basıncı üretmek için daha çok enerji harcar."}, {"d": "Fizyoloji", "t": "Y", "src": "Slayt: venöz dönüş", "q": "Aşağıdakilerden hangisi venöz dönüşü ARTIRMAZ?", "o": ["İskelet kası pompası", "İnspirasyon", "Venokonstriksiyon", "Kan hacminin artması", "Sağ atriyum basıncının artması"], "a": 4, "e": "Venöz dönüş, ortalama sistemik dolum basıncı ile <strong>sağ atriyum basıncı arasındaki farka</strong> bağlıdır. Sağ atriyum basıncı artarsa fark azalır, dönüş azalır."}, {"d": "Fizyoloji", "t": "Y", "src": "Slayt: baroreseptör refleksi (sıralı soru 2023 · 2024)", "q": "Karotid sinüse masaj (dıştan bası) uygulanan bir kişide beklenen yanıt hangisidir?", "o": ["Taşikardi ve kan basıncında artış", "Bradikardi ve kan basıncında düşme", "Periferik vazokonstriksiyon", "Renin salınımında artış", "Solunum sayısında belirgin artış"], "a": 1, "e": "Bası baroreseptörü \"basınç yüksek\" diye uyarır → vazomotor merkez baskılanır, vagal tonus artar → <strong>bradikardi ve KB düşüşü</strong> (histoloji slaytında da: \"bası uygulanınca senkop\")."}, {"d": "Fizyoloji", "t": "Y", "src": "Slayt: akım hızı ve kesit alanı (2K1'de \"kapillerde en yavaş\" soruldu)", "q": "Kan akımı sabitken damarların toplam kesit alanı iki katına çıkarsa kan akım hızı nasıl değişir?", "o": ["İki katına çıkar", "Dört katına çıkar", "Değişmez", "Yarıya iner", "Dörtte birine iner"], "a": 3, "e": "v = Q / A. Akım sabit, alan 2 kat → <strong>hız yarıya iner</strong>. Bu yüzden toplam kesit alanı en büyük olan kapillerlerde akım en yavaş."}, {"d": "Fizyoloji", "t": "Y", "src": "Slayt: kan hacminin dağılımı (Derleme'de venöz kompliyans soruldu)", "q": "Dinlenimde toplam kan hacminin en büyük bölümü nerede bulunur?", "o": ["Sistemik arterler", "Kapillerler", "Sistemik venler", "Pulmoner dolaşım", "Kalp boşlukları"], "a": 2, "e": "Kanın yaklaşık <strong>%64'ü sistemik venlerde</strong>: venler yüksek kompliyanslı <strong>depo damarları</strong>dır."}, {"d": "Fizyoloji", "t": "Y", "src": "Slayt: lenf akımı ve ödem", "q": "Aşağıdakilerden hangisi lenf akımını en çok artırır?", "o": ["İnterstisyel sıvı basıncının artması", "Plazma onkotik basıncının artması", "Kapiller hidrostatik basıncın azalması", "Kapiller geçirgenliğin azalması", "İskelet kası aktivitesinin durması"], "a": 0, "e": "İnterstisyel basınç yükseldikçe (yaklaşık 0 mmHg'ye kadar) lenf akımı <strong>katlanarak</strong> artar. Kas aktivitesi de lenfi pompalar."}]}, {"id": "d2", "key": "deneme-v2", "tab": "Deneme 2", "title": "Deneme 2", "intro": "Her slayt dosyasından en az bir soru: fizyolojinin 10, anatominin 5, histolojinin 4 dosyası, biyokimyanın 4 konusu. Dağılım ve çıkmış oranı Deneme 1 ile aynı; Deneme 1'deki sorular tekrar edilmedi.", "qs": [{"d": "Histoloji", "t": "A", "src": "2023 · 2K1 · Slayt: Damarların ince yapısı", "q": "Aşağıdakilerden hangisi vasa vasorumu doğru olarak ifade eder?", "o": ["Büyük damarları besleyen damarlardır.", "Dağıtıcı arterlerin bifurkasyon yaptığı yerdir.", "Müsküler venlerdeki tunika intima katlantılarıdır.", "Büyük damarların lenfatikleridir.", "İletici arterlerden ilk çıkan arter dalıdır."], "a": 0, "e": "Vasa vasorum büyük damarların adventisyasında ve medyanın dış kısmında, damar duvarını besler. Sinirleri <strong>nervi vasorum</strong> (norepinefrinli sempatik lifler)."}, {"d": "Histoloji", "t": "D", "src": "Asıl soru: \"Müsküler arter yapısındaki damar → radyal arter\" (2F1); bu kez elastik arter", "q": "Aşağıdaki damarlardan hangisi büyük elastik (iletici) arter yapısındadır?", "o": ["Radyal arter", "Popliteal arter", "Splenik arter", "A. carotis communis", "İnterkostal arter"], "a": 3, "e": "Elastik arterler: <strong>aort, brakiyosefalik, carotis communis, subclavia, iliaca communis</strong>. Diğerleri slayttaki müsküler (dağıtıcı) arter listesinden."}, {"d": "Histoloji", "t": "A", "src": "Online · Slayt: Embriyoloji I", "q": "Dört haftalık embriyoda aşağıdakilerden hangisi embriyonun gövdesinden kalbine kan taşır?", "o": ["Vitellin venler", "Umbilikal venler", "Ana kardinal venler", "Dorsal aorta", "Umbilikal arterler"], "a": 2, "e": "Vitellin venler vitellus kesesinden, umbilikal venler plasentadan, <strong>ana kardinal venler embriyo gövdesinden</strong> kan getirir."}, {"d": "Histoloji", "t": "D", "src": "Asıl soru: \"Sinüs venozus boynuzlarına giriş yapmayan\" (2023); bu kez kan içeriği soruluyor", "q": "4 haftalık embriyoda sinüs venozus boynuzlarına giren venlerden hangisi oksijenden zengin kan taşır?", "o": ["Vitellin venler", "Posterior kardinal venler", "Ana kardinal venler", "Anterior kardinal venler", "Umbilikal venler"], "a": 4, "e": "Umbilikal venler koryon villuslarından (plasentadan) <strong>oksijenden zengin</strong> kan getirir. Vitellin ve kardinal venler oksijenden fakir kan taşır."}, {"d": "Histoloji", "t": "Y", "src": "Slayt: Kalp ve damar histolojisi (öğrenci notu: \"önemli hormon\")", "q": "Atriyal natriüretik faktörü salgılayan hücreler ve temel etkisi hangi şıkta doğru verilmiştir?", "o": ["Ventrikül kardiyositleri – sodyum tutulumu", "Endotel hücreleri – GFR'nin azalması", "Purkinje hücreleri – vazokonstriksiyon", "Atriyal kardiyositler – diürez ve natriürez", "Nodal kardiyomiyositler – renin salınımı"], "a": 3, "e": "Atriyal kardiyositler <strong>gerilince</strong> ANF salgılar → GFR artar, <strong>diürez ve natriürez</strong> olur, kan hacmi azalır."}, {"d": "Histoloji", "t": "Y", "src": "Slayt: Kan doku, çalışma sorusu 3", "q": "İnsan kanında en fazla bulunan lökosit hangisidir?", "o": ["Lenfosit", "Monosit", "Eozinofil", "Bazofil", "Nötrofil"], "a": 4, "e": "Nötrofiller lökositlerin <strong>%50–70</strong>'i. Lenfosit ~%30, monosit ~%2, eozinofil %2–4, bazofil %0,5."}, {"d": "Histoloji", "t": "Y", "src": "Slayt: Damarların ince yapısı (yıldızlı cümle)", "q": "Kan hücrelerinin diyapedezle dokuya geçişinde tercih edilen, endotel bağlantılarının en gevşek olduğu ve medyasında yalnızca perisit bulunan damar segmenti hangisidir?", "o": ["Terminal arteriyol", "Metarteriyol", "Gerçek kapiller", "Postkapiller venül", "Müsküler venül"], "a": 3, "e": "Slayt: postkapiller venüller diyapedezin tercih edildiği yer, endotel arası bağlantılar en gevşek, <strong>medyada sadece perisit</strong> var."}, {"d": "Anatomi", "t": "A", "src": "2F1 · Slayt S2-3", "q": "Aşağıdakilerden hangisi \"crista terminalis\" için doğrudur?", "o": ["Ventriculus dexter'de yer alır.", "Ventriculus sinister'de yer alır.", "Septum interatriale'de bulunur.", "İçerisinde nodus atrioventricularis bulunur.", "İçerisinde nodus sinoatrialis bulunur."], "a": 4, "e": "Crista terminalis sağ atriyumda, VCS ile VCI ağzı arasında; içinde <strong>SA düğüm</strong>. AV düğüm Koch üçgeninde."}, {"d": "Anatomi", "t": "A", "src": "Online · Derleme · Slayt S4", "q": "Aşağıdaki seçeneklerden hangisi arteria meningea media'nın orijin aldığı arterdir?", "o": ["Arteria occipitalis", "Arteria maxillaris", "Arteria ophthalmica", "Arteria thyroidea superior", "Arteria thyroidea inferior"], "a": 1, "e": "Meningea media <strong>a. maxillaris</strong>'ten çıkar, foramen spinosum'dan girer; yaralanırsa epidural hematom."}, {"d": "Anatomi", "t": "A", "src": "2F1 · Slayt S4", "q": "Aşağıdaki venlerden hangisi, cranium içinde sinüs cavernosus'a drene olur?", "o": ["Vena maxillaris", "Vena temporalis superficialis", "Vena angularis", "Vena lingualis", "Vena occipitalis"], "a": 2, "e": "V. angularis → v. ophthalmica superior → sinus cavernosus. Yüzün \"tehlikeli üçgeni\"."}, {"d": "Anatomi", "t": "A", "src": "2023 · Derleme · Slayt S6", "q": "Aşağıdaki damarlardan hangisi arteria fibularis'in orijin aldığı damardır?", "o": ["Arteria tibialis anterior", "Arteria tibialis posterior", "Arteria poplitea", "Arteriae surales", "Arteria dorsalis pedis"], "a": 1, "e": "A. fibularis arka kompartmanda <strong>a. tibialis posterior</strong>'dan ayrılır."}, {"d": "Anatomi", "t": "D", "src": "Asıl soru: \"A. ulnaris'in dallarından oluşan seçenek\" (2023); bu kez radialis", "q": "Aşağıdaki seçeneklerden hangisi arteria radialis'in dallarından oluşur?<span class=\"rom\"><span>I- A. recurrens radialis</span><span>II- A. princeps pollicis</span><span>III- A. interossea communis</span><span>IV- A. radialis indicis</span><span>V- A. collateralis ulnaris superior</span></span>", "o": ["I, II, III", "I, III, IV", "II, III, V", "I, II, IV", "III, IV, V"], "a": 3, "e": "Radialis: recurrens radialis, princeps pollicis, radialis indicis. Interossea communis <strong>ulnaris</strong>, collateralis ulnaris superior <strong>brachialis</strong> dalı."}, {"d": "Anatomi", "t": "D", "src": "Asıl soru: ductus arteriosus/venosus (2023 · Online · 2K1); aynı şıklar, bu kez v. umbilicalis", "q": "Aşağıdakilerden hangisi \"vena umbilicalis\" için doğrudur?", "o": ["Embriyolojik dönemde vena porta hepatis ile vena cava inferior arasında anastomoz oluşturur.", "Embriyolojik dönemde vena cava superior ile vena pulmonalis arasında anastomoz oluşturur.", "Yenidoğanda kapanması sonucunda ligamentum umbilicale mediale oluşur.", "Yenidoğanda kapanması sonucunda Botallo ligamenti oluşur.", "Yenidoğanda kapanması sonucunda ligamentum teres hepatis oluşur."], "a": 4, "e": "V. umbilicalis → <strong>lig. teres hepatis</strong>. Porta–VCI anastomozu ductus venosus, Botallo ductus arteriosus, lig. umbilicale mediale a. umbilicalis içindir."}, {"d": "Anatomi", "t": "D", "src": "Asıl soru: \"A. thoracica interna kanlandırmaz\" (2F1 · 2025) ve \"a. intercostalis anterior orijini\" (2024)", "q": "Arteria thoracica interna'nın iki uç dalı hangileridir?", "o": ["A. pericardiacophrenica ve a. intercostalis posterior", "A. musculophrenica ve a. epigastrica superior", "A. epigastrica superior ve a. epigastrica inferior", "A. thoracodorsalis ve a. musculophrenica", "A. intercostalis suprema ve a. epigastrica superior"], "a": 1, "e": "Thoracica interna 6. ICS hizasında <strong>a. musculophrenica</strong> ve <strong>a. epigastrica superior</strong> olarak ikiye ayrılır. Epigastrica inferior a. iliaca externa'dan çıkar."}, {"d": "Anatomi", "t": "Y", "src": "Slayt S1: Dolaşım sistemine giriş (liste)", "q": "Aşağıdaki dokulardan hangisinde kapiller bulunmaz?", "o": ["Karaciğer", "İskelet kası", "Böbrek", "Kornea", "Akciğer"], "a": 3, "e": "Slayt: kapiller hiç olmayan yerler <strong>kornea, lens, kalp kapağı, hiyalin kıkırdak</strong>. Kas, bezler, karaciğer, akciğer, böbrek kapillerden zengin."}, {"d": "Biyokimya", "t": "A", "src": "2023", "q": "Aşağıdaki hem proteinlerinden hangisinin bir molekülünde 4 hem grubu bulunur?", "o": ["Hemoglobin", "Miyoglobin", "Sitokrom", "Katalaz", "Peroksidaz"], "a": 0, "e": "Hemoglobin tetramer, her alt birimde bir hem → 4 hem. Miyoglobin monomer, tek hem."}, {"d": "Biyokimya", "t": "A", "src": "Online · Derleme", "q": "Aşağıdakilerden hangisi ksenobiyotik metabolizmasının sitokrom P450 aracılı reaksiyonlarından değildir?", "o": ["Alifatik oksidasyon", "Aromatik hidroksilasyon", "O-dealkilasyon", "Glukuronidasyon", "Oksidatif deaminasyon"], "a": 3, "e": "Glukuronidasyon faz II konjugasyonudur (UDP-glukuroniltransferaz), P450 ile olmaz."}, {"d": "Biyokimya", "t": "D", "src": "Asıl soru: \"Faz I reaksiyonu\" (2K1: dealkilasyon); şıklar yenilendi", "q": "Aşağıdakilerden hangisi ksenobiyotik metabolizmasının faz I reaksiyonlarındandır?", "o": ["Glukuronidasyon", "Sülfatasyon", "Glutatyon konjugasyonu", "Asetilasyon", "Hidroliz"], "a": 4, "e": "Faz I: oksidasyon, redüksiyon, <strong>hidroliz</strong> (hidroksilasyon, dealkilasyon...). Diğerleri faz II konjugasyonları."}, {"d": "Biyokimya", "t": "D", "src": "Asıl soru: \"Hem sentezinin hız sınırlayıcı enzimi → ALA sentaz\" (2023); aynı şıklar, son basamak", "q": "Hem sentezinin son basamağında protoporfirin IX'a Fe²⁺ ekleyen enzim hangisidir?", "o": ["ALA sentaz", "Ferroşelataz", "Porfobilinojen sentaz", "Üroporfirinojen sentaz", "Porfobilinojen deaminaz"], "a": 1, "e": "<strong>Ferroşelataz</strong> (mitokondride) demiri protoporfirin IX'a ekler. İlk basamak ALA sentaz, hız sınırlayıcı da odur."}, {"d": "Biyokimya", "t": "Y", "src": "Konu: hemoglobin (2024'te \"O₂ bağlanmasını azaltan → 2,3-BPG\" soruldu)", "q": "2,3-bisfosfogliserat ile ilgili hangisi doğrudur?", "o": ["Oksihemoglobine bağlanarak O₂ afinitesini artırır.", "HbF'ye HbA'dan daha güçlü bağlanır.", "Deoksihemoglobine bağlanır ve O₂ afinitesini azaltır.", "Disosiyasyon eğrisini sola kaydırır.", "Miyoglobinin O₂ bağlamasını düzenler."], "a": 2, "e": "2,3-BPG <strong>deoksi-Hb (T formu)</strong> β zincirleri arasına bağlanır, afiniteyi azaltır, eğriyi <strong>sağa</strong> kaydırır. HbF'ye zayıf bağlanır."}, {"d": "Biyokimya", "t": "Y", "src": "Konu: bilirubin metabolizması", "q": "Konjuge olmamış (indirekt) bilirubin için hangisi doğrudur?", "o": ["Suda çözünür ve idrara geçer.", "Bağırsakta ürobilinojenden oluşur.", "Safraya doğrudan atılır.", "Hepatositte glukuronik asitle bağlanmış hâldedir.", "Kanda albümine bağlı taşınır."], "a": 4, "e": "İndirekt bilirubin suda çözünmez, <strong>albüminle</strong> taşınır, idrara geçmez. Karaciğerde glukuronidasyonla direkt (suda çözünür) hâle gelir."}, {"d": "Biyokimya", "t": "Y", "src": "Konu: hem sentezi", "q": "Kurşun zehirlenmesinde inhibe olan hem sentezi enzimleri hangileridir?", "o": ["ALA sentaz ve PBG deaminaz", "ALA dehidrataz (PBG sentaz) ve ferroşelataz", "Üroporfirinojen dekarboksilaz ve ALA sentaz", "Koproporfirinojen oksidaz ve hem oksijenaz", "Biliverdin redüktaz ve ferroşelataz"], "a": 1, "e": "Kurşun <strong>ALA dehidrataz</strong> ve <strong>ferroşelataz</strong>ı inhibe eder → ALA ve protoporfirin birikir."}, {"d": "Biyokimya", "t": "Y", "src": "Konu: sitokrom P450", "q": "Ksenobiyotik metabolizmasında görevli sitokrom P450 enzimleri en yoğun olarak nerede bulunur?", "o": ["Karaciğer hücrelerinin düz endoplazmik retikulumunda", "Böbrek tübül hücrelerinin lizozomlarında", "Eritrosit sitozolünde", "Hepatosit çekirdeğinde", "Peroksizomlarda"], "a": 0, "e": "Ksenobiyotik P450'leri karaciğerin <strong>düz ER</strong> (mikrozom) zarındadır. Steroid sentezindekiler mitokondride."}, {"d": "Fizyoloji", "t": "A", "src": "2F1 · Slayt: İyon akımları ve AP", "q": "Kalpte SA düğümde dinlenim membran potansiyeli ve eşik değer ne kadardır?", "o": ["−40 mV, −20 mV", "−60 mV, −40 mV", "−65 mV, −50 mV", "−90 mV, −60 mV", "−90 V, −60 V"], "a": 1, "e": "Yavaş cevap (SA, AV): dinlenim <strong>−60</strong>, eşik <strong>−40</strong> mV. Hızlı cevap (kas): dinlenim −90."}, {"d": "Fizyoloji", "t": "Y", "src": "Slayt: İyon akımları ve AP", "q": "SA düğüm aksiyon potansiyelinde aşağıdaki fazlardan hangileri bulunmaz?", "o": ["Faz 0 ve faz 4", "Faz 3 ve faz 4", "Faz 1 ve faz 2", "Faz 0 ve faz 3", "Sadece faz 4"], "a": 2, "e": "SA düğümde <strong>faz 1 ve plato (faz 2) yoktur</strong>: faz 4 (funny), faz 0 (L-Ca), faz 3 (K⁺ çıkışı)."}, {"d": "Fizyoloji", "t": "A", "src": "2023 · Slayt: EKG giriş", "q": "Normalde SA (sino-atriyal) noddan çıkan uyarı kaç saniye sonra AV (atriyoventriküler) nodda olur?", "o": ["0,03", "0,09", "0,12", "0,16", "0,22"], "a": 0, "e": "Slayt: AV düğüme <strong>0,03 s</strong>, ventriküllere 0,16 s, ventriküllerin tamamı 0,22 s."}, {"d": "Fizyoloji", "t": "D", "src": "Asıl soru: \"Sempatik uyarının kalbe etkisi\" (2023); aynı şıklar, bu kez vagal", "q": "Aşağıdakilerden hangisi vagal (parasempatik) uyarının SA düğüme etkisini en doğru açıklar?", "o": ["SA nodda sodyum geçirgenliğini artırır.", "SA nod dinlenim membran potansiyelini yukarı doğru çıkarır.", "Kalp kasının kalsiyum geçirgenliğini artırır.", "SA nodda potasyum geçirgenliğini artırarak hiperpolarizasyon yapar.", "Funny akımı artırır."], "a": 3, "e": "ACh → M2 → <strong>K⁺ çıkışı artar → hiperpolarizasyon</strong>, eşiğe ulaşmak gecikir, kalp yavaşlar. \"Dinlenim potansiyelini yukarı çıkarır\" sempatiğin etkisi."}, {"d": "Fizyoloji", "t": "A", "src": "2F1 · 2024 · Slayt: EKG II", "q": "Hastanın EKG'sinde RR intervali 20 mm, kağıt hızı 25 mm/s. Kalp hızı ne kadardır?", "o": ["60 atım/dk", "80 atım/dk", "75 atım/dk", "100 atım/dk", "120 atım/dk"], "a": 2, "e": "1500 ÷ 20 = <strong>75</strong>."}, {"d": "Fizyoloji", "t": "Y", "src": "Slayt: EKG II (Einthoven)", "q": "Einthoven yasasına göre bipolar ekstremite derivasyonları arasındaki ilişki hangisidir?", "o": ["DI + DII = DIII", "DI − DII = DIII", "DII + DIII = DI", "DI = DII = DIII", "DI + DIII = DII"], "a": 4, "e": "<strong>DI + DIII = DII.</strong> Herhangi iki derivasyon bilinirse üçüncüsü hesaplanır."}, {"d": "Fizyoloji", "t": "Y", "src": "Slayt: Kalp döngüsü giriş", "q": "Atriyal sistolün ventrikül doluşuna katkısı slayta göre yaklaşık ne kadardır?", "o": ["%5", "%70", "%50", "%15", "%80"], "a": 3, "e": "Slayt: atriyal sistol doluşa <strong>~%15</strong> ekler. Doluşun büyük kısmı (%80) hızlı doluşta pasif olur."}, {"d": "Fizyoloji", "t": "D", "src": "Asıl soru: \"Venöz nabız eğrisinde hatalı ifade\" (Online); bu kez c dalgası", "q": "Juguler venöz nabız eğrisinde \"c dalgası\"nın nedeni hangisidir?", "o": ["Diyastol sonunda atriyum kasılması", "Atriyum gevşemesi", "Venlerden atriyuma dolum", "AV kapakların açılıp kanın ventriküle geçmesi", "İzovolümetrik kasılmada kapalı AV kapakların atriyuma bombelenmesi"], "a": 4, "e": "a = atriyum kasılması, <strong>c = AV kapak bombelenmesi</strong>, x = atriyum gevşemesi, v = atriyum dolması, y = AV kapakların açılması."}, {"d": "Fizyoloji", "t": "A", "src": "2023 · Derleme · Slayt: Kalp döngüsü ve sesler", "q": "Birinci kalp sesinin zamanlaması EKG kaydında hangi döneme denk gelir?", "o": ["P dalgası sonu", "PR aralığı sonrası", "QRS dalgası hemen sonrası", "T dalgası", "T dalgası sonrası"], "a": 2, "e": "S1 = AV kapakların kapanması; ventrikül kasılması QRS ile başlar → <strong>QRS'ten hemen sonra</strong>."}, {"d": "Fizyoloji", "t": "D", "src": "Asıl soru: sol 5. ICS diyastolik üfürüm → mitral stenoz (Online · 2F1); aynı şıklar, sistolik", "q": "Apekste (sol 5. ICS midklaviküler hat) duyulan ve aksillaya yayılan SİSTOLİK üfürüm neyi düşündürür?", "o": ["Mitral kapak stenozu", "Mitral kapak yetmezliği", "Aort kapağı stenozu", "Aort kapağı yetmezliği", "Triküspit kapak yetmezliği"], "a": 1, "e": "Mitral sistolde <strong>kapalı</strong> olmalı; kapalıyken ses = <strong>yetmezlik</strong>. Mitral stenoz diyastolik."}, {"d": "Fizyoloji", "t": "Y", "src": "Slayt: Kalp debisi", "q": "Art yük (afterload) artışının beklenen sonucu hangisidir?", "o": ["Atım hacmi azalır, ESV artar", "Atım hacmi artar, ESV azalır", "EDV azalır, atım hacmi değişmez", "Kontraktilite azalır", "Ejeksiyon fraksiyonu artar"], "a": 0, "e": "Ventrikül daha yüksek basınca karşı fırlatır → <strong>atım hacmi azalır</strong>, ventrikülde daha çok kan kalır (<strong>ESV artar</strong>)."}, {"d": "Fizyoloji", "t": "Y", "src": "Slayt: Kalp debisi / basınç–hacim döngüsü", "q": "Kontraktilitenin artması basınç–hacim döngüsünde nasıl bir değişiklik yapar?", "o": ["EDV artar, atım hacmi değişmez", "Döngü sağa kayar, alan küçülür", "ESV artar, atım hacmi azalır", "ESV azalır, atım hacmi artar", "Sadece izovolümetrik gevşeme uzar"], "a": 3, "e": "Daha güçlü kasılma ventrikülü daha çok boşaltır → <strong>ESV azalır</strong>, döngü sola genişler, <strong>atım hacmi artar</strong>."}, {"d": "Fizyoloji", "t": "A", "src": "2F1 · Slayt: Dolaşım mekaniği", "q": "Türbülan akım oluşum şekli ve nedenleri arasında aşağıdakilerden hangisi yer almaz?", "o": ["Parabolik profilin varlığı", "Reynolds sayısının 3000 üstünde olması", "Kapak darlıkları", "Aterosklerotik plak varlığı", "Arteriyo-venöz fistül varlığı"], "a": 0, "e": "Parabolik profil <strong>laminer</strong> akımın özelliği. Diğerleri türbülans yapar."}, {"d": "Fizyoloji", "t": "D", "src": "Asıl soru: Korotkoff 130 / nabız basıncı 45 → diyastolik 85 (2023); MAP sorusuyla birleştirildi", "q": "Oskültasyonla ölçümde Korotkoff sesleri 140 mmHg'de başlıyor ve 90 mmHg'de kayboluyor. Nabız basıncı ve ortalama arter basıncı yaklaşık kaçtır?", "o": ["230 mmHg ve 115 mmHg", "50 mmHg ve 115 mmHg", "90 mmHg ve 140 mmHg", "40 mmHg ve 100 mmHg", "50 mmHg ve 107 mmHg"], "a": 4, "e": "Sistolik 140, diyastolik 90 → NB <strong>50</strong>. OAB = 90 + 50/3 ≈ <strong>107</strong>."}, {"d": "Fizyoloji", "t": "Y", "src": "Slayt: Kan akımı ve düzenlenmesi", "q": "Hipoksinin akciğer damarları ve sistemik damarlar üzerindeki etkisi sırasıyla hangisidir?", "o": ["Vazodilatasyon – vazodilatasyon", "Vazokonstriksiyon – vazodilatasyon", "Vazodilatasyon – vazokonstriksiyon", "Vazokonstriksiyon – vazokonstriksiyon", "Etkisiz – vazodilatasyon"], "a": 1, "e": "Akciğerde hipoksi damarı <strong>daraltır</strong> (kanı iyi havalanan alveollere yönlendirir), vücudun geri kalanında <strong>genişletir</strong>."}, {"d": "Fizyoloji", "t": "Y", "src": "Slayt: Kan akımı ve düzenlenmesi", "q": "Damarların otonom innervasyonu için hangisi doğrudur?", "o": ["Sadece parasempatik lifler bulunur.", "Sempatik ve parasempatik eşit dağılır.", "Sadece sempatik lifler bulunur; α1 daraltır, iskelet kasında β2 genişletir.", "Kapiller düz kasında yoğun sinir sonlanması vardır.", "Venlerde sinir lifi bulunmaz."], "a": 2, "e": "Damarlarda <strong>yalnızca sempatik</strong> innervasyon var (genital ve bazı istisnalar dışında). Kapillerlerde düz kas yok."}, {"d": "Fizyoloji", "t": "D", "src": "Asıl soru: Starling hesapları (2F1 · 2K1); bu kez negatif interstisyel basınçla", "q": "Bir kapillerde Pc = 30 mmHg, interstisyel sıvı basıncı = −3 mmHg, plazma onkotik basıncı = 28 mmHg, interstisyel onkotik basınç = 8 mmHg. Net sıvı hareketi nedir?", "o": ["Filtrasyon; 19 mmHg", "Filtrasyon; 7 mmHg", "Absorbsiyon; 13 mmHg", "Filtrasyon; 13 mmHg", "Absorbsiyon; 7 mmHg"], "a": 3, "e": "Net = (Pc + Πif) − (Πc + Pif) = (30 + 8) − (28 + (−3)) = 38 − 25 = <strong>+13 → filtrasyon</strong>. Negatif Pif dışarı çeker; işareti unutursan 7 bulursun."}, {"d": "Fizyoloji", "t": "Y", "src": "Slayt: Kapiller dolaşım ve ödem", "q": "Aşağıdakilerden hangisi plazma onkotik basıncının azalmasına bağlı ödeme örnektir?", "o": ["Konjestif kalp yetmezliği", "Hareketsiz ayakta durma", "Akut inflamasyon", "Elefantiazis", "Nefrotik sendrom"], "a": 4, "e": "Nefrotik sendromda albümin kaybı → <strong>onkotik basınç ↓</strong>. Kalp yetmezliği ve ayakta durma hidrostatik, elefantiazis lenf tıkanması, inflamasyon geçirgenlik."}, {"d": "Fizyoloji", "t": "A", "src": "2023 · 2024 · Slayt: KB regülasyonu", "q": "Baroreseptör refleks arkının fizyolojik mekanizması hangisinde doğru sıralanmıştır? (I baroreseptör deşarjında artış · II hipertansiyon · III vazomotor merkez inhibisyonu · IV periferik direnç azalması · V baroreseptör deşarjında azalma)", "o": ["II–I–III–IV–V", "I–II–III–IV–V", "III–II–V–I–IV", "IV–II–V–III–I", "V–II–I–IV–III"], "a": 0, "e": "KB artar → deşarj artar → vazomotor merkez baskılanır → direnç düşer → KB düşünce deşarj azalır."}, {"d": "Fizyoloji", "t": "D", "src": "Asıl soru: \"Cushing refleksi için hatalı → refleks taşikardi\" (2024); doğru olan soruluyor", "q": "Cushing refleksi için hangisi doğrudur?", "o": ["Kafa içi basınç düşünce ortaya çıkar.", "Hipotansiyon, taşikardi ve hızlı solunum ile seyreder.", "Hipertansiyon, bradikardi ve düzensiz solunum ile seyreder.", "Baroreseptörlerin baskılanmasıyla ilgisizdir; bradikardi olmaz.", "Böbrek kaynaklı uzun dönem bir yanıttır."], "a": 2, "e": "Kafa içi basınç ↑ → beyin iskemisi → KB yükselir; baroreseptör uyarısıyla <strong>bradikardi</strong>; solunum düzensizleşir (Cushing triadı)."}, {"d": "Fizyoloji", "t": "Y", "src": "Slayt: KB regülasyonu", "q": "Hızlı sıvı yüklemesiyle venöz dönüş arttığında kalp hızının artmasını sağlayan refleks hangisidir?", "o": ["Baroreseptör refleksi", "Bainbridge refleksi", "Cushing refleksi", "Bezold–Jarisch refleksi", "Kemoreseptör refleksi"], "a": 1, "e": "<strong>Bainbridge:</strong> atriyum gerilim reseptörleri → kalp <strong>hızlanır</strong>. Baroreseptör refleksi KB artışında kalbi yavaşlatır."}, {"d": "Fizyoloji", "t": "Y", "src": "Slayt: KB regülasyonu", "q": "MSS iskemik yanıtı ortalama arter basıncı hangi değerin altına düştüğünde belirgin olarak devreye girer?", "o": ["120 mmHg", "100 mmHg", "80 mmHg", "60 mmHg", "20 mmHg"], "a": 3, "e": "Slayt: OAB <strong>60 mmHg altına</strong> inince vazomotor merkez iskemisi → çok güçlü sempatik yanıt (\"son savunma hattı\")."}]}, {"id": "d3", "key": "deneme-v3", "tab": "Deneme 3", "title": "Deneme 3", "intro": "Yine her slayt dosyasından en az bir soru, bu kez Deneme 1 ve 2'de olmayan noktalardan. Dağılım ve çıkmış oranı aynı.", "qs": [{"d": "Histoloji", "t": "A", "src": "2K1 · 2F1 · 2024 · Slayt: Embriyoloji I", "q": "Foramen sekundum nerede yer alır?", "o": ["Septum primum üzerinde", "Septum sekundum üzerinde", "Septum spurium üzerinde", "Septum atrioventrikülare üzerinde", "Septum interventrikülare üzerinde"], "a": 0, "e": "İnce <strong>septum primum</strong>'da önce foramen primum, sonra foramen <strong>sekundum</strong> açılır. Kalın septum sekundum'un açıklığı foramen ovale."}, {"d": "Histoloji", "t": "A", "src": "2F1 · Slayt: Damarların ince yapısı", "q": "Aşağıdaki damarlardan hangisi müsküler arter yapısındadır?", "o": ["Aort", "Brakiyosefalik arter", "Subklavyen arter", "Radyal arter", "Ana iliyak arter"], "a": 3, "e": "Slayt: müsküler (dağıtıcı) arterler radial, tibial, popliteal, aksiller, splenik, mezenterik, interkostal. Diğer dördü elastik."}, {"d": "Histoloji", "t": "D", "src": "Asıl soru: \"Purkinje lifleri nerede gözlenir\" (2K1) ve \"Purkinje hücreleri için doğru\" (2F1); şıklar yenilendi", "q": "Purkinje lifleri için hangisi doğrudur?", "o": ["Özelleşmiş düz kas hücreleridir.", "Atriyal natriüretik faktör salgılarlar.", "Miyelinli sinir lifleridir.", "Epikardiyumda yer alırlar.", "Çizgilidir ve birbirine tipik olmayan interkalar disklerle bağlanır."], "a": 4, "e": "Slayt: Purkinje lifleri kalp kası gibi <strong>çizgili</strong>, <strong>tipik olmayan interkalar disklerle</strong> bağlı, <strong>subendokardiyal</strong> katmanda. ANF atriyal kardiyositlerden."}, {"d": "Histoloji", "t": "D", "src": "Asıl soru: \"Dalak sinüzoidleri hangi tip kapiller\" (2023) ve \"kesintili kapiller nerede\" (2F1); bu kez pencereli", "q": "Aşağıdakilerin hangisinde pencereli (fenestralı) kapiller bulunur?", "o": ["Beyin", "İskelet kası", "Timus", "Karaciğer", "Böbrek glomerülü"], "a": 4, "e": "Pencereli: <strong>endokrin bezler, bağırsak villusu, böbrek glomerülü</strong>. Beyin, kas, timus sürekli; karaciğer sinüzoid."}, {"d": "Histoloji", "t": "Y", "src": "Slayt: Embriyoloji I, çalışma sorusu 10", "q": "Kalp gelişiminde nöral krista hücrelerinin katıldığı ve bozukluğunda konotrunkal anomalilere yol açan yapı hangisidir?", "o": ["Septum primum", "Proepikardiyal organ", "Sinüs venozus sağ boynuzu", "Müsküler interventriküler septum", "Trunkokonal (endokardiyal) yastıkçıklar"], "a": 4, "e": "Trunkokonal yastıkçıklar nöral krista kökenli; bu yüzden kalp anomalileri sıklıkla kraniyofasiyal defektlerle (DiGeorge) birlikte görülür."}, {"d": "Histoloji", "t": "Y", "src": "Slayt: Embriyoloji II", "q": "Aşağıdakilerden hangisi Fallot tetralojisinin bileşenlerinden değildir?", "o": ["Pulmoner stenoz", "Ventriküler septal defekt", "Üste binen (ata binen) aorta", "Sağ ventrikül hipertrofisi", "Atriyal septal defekt"], "a": 4, "e": "Tetraloji: PS + VSD + ata binen aorta + SVH. <strong>ASD veya PDA</strong> eklenirse <strong>pentaloji</strong>."}, {"d": "Histoloji", "t": "Y", "src": "Slayt: Kan doku, çalışma soruları 1 ve 7", "q": "Dolaşımdan dokuya geçerek makrofaja farklılaşan kan hücresi hangisidir?", "o": ["Nötrofil", "Monosit", "Bazofil", "Eozinofil", "B lenfosit"], "a": 1, "e": "Monositler ~20 saat dolaşımda kalır, dokuya geçip <strong>makrofaja</strong> dönüşür. B lenfositler plazma hücresine dönüşür."}, {"d": "Anatomi", "t": "A", "src": "2K1 · 2024 · Slayt S2-3", "q": "Aşağıdakilerden hangisi \"sinus obliquus pericardii\"nin geçiş yeridir?", "o": ["Aorta ve truncus pulmonalis arasından", "Vena cava superior ve inferior arasından", "Vagina serosum venosum'un altından", "Vena jugularis interna ve arteria carotis communis arasından", "Vagina caroticum ve vagina serosum arteriosum arasından"], "a": 2, "e": "Obliquus = venöz kılıfın <strong>altındaki</strong> çıkmaz cep; ön duvarı sol atriyum. Transversus = iki kılıfın arası."}, {"d": "Anatomi", "t": "A", "src": "2023 · 2025 · Slayt S4", "q": "Burnu kanlandıran arterlerden hangisi arteria carotis interna'nın dallarından orijin alır?", "o": ["Arteria sphenopalatina", "Arteria infraorbitalis", "Arteria facialis", "Arteria ethmoidalis anterior", "Arteria labialis superior"], "a": 3, "e": "A. ophthalmica (ICA) → <strong>a. ethmoidalis anterior/posterior</strong>. Sphenopalatina ve infraorbitalis a. maxillaris'ten, facialis ECA'dan."}, {"d": "Anatomi", "t": "A", "src": "Online · 2025 · Slayt S5", "q": "Aşağıdakilerden hangisi fascia clavipectoralis'i delerek vena axillaris'e drene olur?", "o": ["Vena basilica", "Vena cephalica", "Vena brachialis", "Vena mediana antebrachii", "Vena thoracica interna"], "a": 1, "e": "V. cephalica sulcus deltopectoralis'ten fascia clavipectoralis'i delip <strong>v. axillaris</strong>'e açılır. Basilica v. brachialis'e."}, {"d": "Anatomi", "t": "A", "src": "2F1 · 2025 · Slayt S6", "q": "Aşağıdaki damarlardan hangisi arteria poplitea'ya ait değildir?", "o": ["Arteria descendens genus", "Arteria superior lateralis genus", "Arteria media genus", "Arteriae surales", "Arteria inferior lateralis genus"], "a": 0, "e": "Descendens genus <strong>a. femoralis</strong>'in canalis adductorius'taki dalı."}, {"d": "Anatomi", "t": "D", "src": "Asıl soru: \"Kalbin kanlanması için doğru\" (2F1); bu kez venler", "q": "Kalbin venleri ile ilgili hangisi doğrudur?", "o": ["V. cordis magna r. interventricularis posterior'a eşlik eder.", "V. cordis parva r. interventricularis anterior'a eşlik eder.", "V. cordis media sulcus interventricularis posterior'da seyreder.", "Vv. cardiacae minimae sinus coronarius'a dökülür.", "Sinus coronarius sol atriyuma açılır."], "a": 2, "e": "Magna ↔ LAD (önde), <strong>media ↔ arka interventriküler</strong>, parva ↔ sağ marjinal. Vv. cardiacae minimae doğrudan boşluklara açılır; sinus coronarius <strong>sağ</strong> atriyuma."}, {"d": "Anatomi", "t": "D", "src": "Asıl soru: \"Foramen infrapiriforme'den geçenler\" (2023, roma rakamlı); bu kez suprapiriforme", "q": "Foramen suprapiriforme'den geçen yapılar hangi seçenekte verilmiştir?<span class=\"rom\"><span>I- A. glutea superior</span><span>II- N. gluteus superior</span><span>III- N. ischiadicus</span><span>IV- A. pudenda interna</span><span>V- V. glutea superior</span></span>", "o": ["I, IV, V", "I, III, IV", "II, III, IV", "III, IV, V", "I, II, V"], "a": 4, "e": "Suprapiriforme: yalnızca <strong>superior gluteal üçlü</strong> (a., v., n.). Ischiadicus ve pudenda interna infrapiriforme'den geçer."}, {"d": "Anatomi", "t": "D", "src": "Asıl soru: \"Baş-boyunda derin yerleşimli lenfatik → pretracheal\" (Derleme); tersine çevrildi", "q": "Aşağıdaki lenf düğümlerinden hangisi baş-boyun bölgesinde YÜZEYEL yerleşimlidir?", "o": ["Nodi lymphatici pretracheales", "Nodus jugulodigastricus", "Nodi lymphatici occipitales", "Nodi lymphatici retropharyngeales", "Nodi lymphatici paratracheales"], "a": 2, "e": "Yüzeyel: <strong>occipitales, mastoidei, parotidei superficiales, buccales, cervicales superficiales</strong>. Jugulo- zinciri ve trachea/larinks çevresi derin."}, {"d": "Anatomi", "t": "Y", "src": "Slayt S5: Üst ekstremite lenfatikleri (hiç sorulmadı; alt ekstremite sorusunun eşi)", "q": "Elin başparmak tarafından, v. cephalica boyunca gelen yüzeyel lenfatikler ilk olarak hangi lenf düğümlerine drene olur?", "o": ["Nodi lymphatici cubitales (supratrochleares)", "Nodi lymphatici infraclaviculares (deltopectorales)", "Nodi lymphatici axillares centrales", "Nodi lymphatici supraclaviculares", "Nodi lymphatici parasternales"], "a": 1, "e": "Lenf yüzeyel veni takip eder: <strong>cephalica → infraclavicular (deltopektoral)</strong>, basilica (serçe parmak tarafı) → cubital."}, {"d": "Biyokimya", "t": "A", "src": "2K1", "q": "Aşağıdaki hemoproteinlerden hangisi proteinlerin kuarterner yapısına sahiptir?", "o": ["Hemoglobin", "Katalaz", "Miyoglobin", "Peroksidaz", "Sitokromlar"], "a": 0, "e": "Kuarterner yapı = birden fazla alt birim: <strong>hemoglobin (α2β2)</strong>. Beklenen cevap hemoglobin."}, {"d": "Biyokimya", "t": "A", "src": "2K1", "q": "Aşağıdakilerden hangisine etki eden sitokrom P450 enzim sınıfı mitokondriyal yerleşimlidir?", "o": ["İlaç", "Karsinojen", "Kolesterol", "Mutajen", "Toksin"], "a": 2, "e": "Ksenobiyotik P450'ler ER'de; <strong>steroid sentezi</strong> (kolesterol yan zincir kesimi) mitokondride."}, {"d": "Biyokimya", "t": "D", "src": "Asıl soru: \"A alt birimine 2 molekül bilirubin\" (2023) ve \"hücre içinde taşıyan → ligandin\" (Online); aynı şıklar", "q": "Hepatositte bilirubin aşağıdakilerden hangisiyle konjuge edilerek suda çözünür hâle getirilir?", "o": ["Albümin", "Ligandin", "Z proteini", "Lumirubin", "Glukuronik asit"], "a": 4, "e": "UDP-glukuroniltransferaz bilirubine <strong>glukuronik asit</strong> bağlar (bilirubin diglukuronid). Albümin kanda, ligandin ve Z proteini hücre içinde taşıyıcı."}, {"d": "Biyokimya", "t": "D", "src": "Asıl soru: \"HbF için yanlış → demiri Fe³⁺\" (2025)", "q": "Methemoglobinde demirin değerliği nedir ve oksijen bağlayabilir mi?", "o": ["Fe²⁺, bağlar", "Fe³⁺, bağlayamaz", "Fe²⁺, bağlayamaz", "Fe³⁺, daha güçlü bağlar", "Fe⁰, bağlar"], "a": 1, "e": "Normal Hb <strong>Fe²⁺</strong>; okside (<strong>Fe³⁺</strong>) hâli methemoglobindir ve O₂ taşıyamaz."}, {"d": "Biyokimya", "t": "Y", "src": "Konu: hem sentezi", "q": "Hem sentezinde sitozolde gerçekleşen basamağı katalizleyen enzim hangisidir?", "o": ["ALA sentaz", "Protoporfirinojen oksidaz", "Koproporfirinojen oksidaz", "ALA dehidrataz (PBG sentaz)", "Ferroşelataz"], "a": 3, "e": "İlk basamak ve son üç basamak <strong>mitokondride</strong>; ALA dehidrataz, PBG deaminaz, üroporfirinojen III sentaz ve dekarboksilaz <strong>sitozolde</strong>."}, {"d": "Biyokimya", "t": "Y", "src": "Konu: porfirinler", "q": "Akut intermitan porfiride eksik olan enzim hangisidir?", "o": ["Ferroşelataz", "Hem oksijenaz", "ALA sentaz", "Üroporfirinojen dekarboksilaz", "Porfobilinojen deaminaz (hidroksimetilbilan sentaz)"], "a": 4, "e": "AİP: <strong>PBG deaminaz</strong> eksikliği, ALA ve PBG birikir (ışığa duyarlılık yok). Üroporfirinojen dekarboksilaz eksikliği porfiria kutanea tarda."}, {"d": "Biyokimya", "t": "Y", "src": "Konu: hemoglobin", "q": "Bohr etkisi için hangisi doğrudur?", "o": ["H⁺ ve CO₂ artışı hemoglobinin O₂ afinitesini azaltır.", "pH artışı O₂'nin dokuya verilmesini kolaylaştırır.", "Bohr etkisi eğriyi sola kaydırır.", "Miyoglobinde belirgindir.", "2,3-BPG azalmasıyla oluşur."], "a": 0, "e": "Dokuda <strong>H⁺ ve CO₂ ↑ → afinite ↓</strong>, eğri sağa kayar, O₂ dokuya bırakılır."}, {"d": "Biyokimya", "t": "Y", "src": "Konu: faz II (ligandin bağlantısı)", "q": "Ksenobiyotiklerin glutatyonla konjugasyonunu katalizleyen ve \"ligandin\" olarak da bilinen enzim ailesi hangisidir?", "o": ["UDP-glukuroniltransferaz", "Glutatyon S-transferaz", "Sülfotransferaz", "N-asetiltransferaz", "Metiltransferaz"], "a": 1, "e": "<strong>Glutatyon S-transferazlar</strong> = ligandin; hem faz II enzimidir hem de hepatositte bilirubini bağlar."}, {"d": "Fizyoloji", "t": "A", "src": "2F1 · Slayt: İyon akımları ve AP", "q": "Kalpte faz 4 ve faz 0'da yavaş cevap aksiyon potansiyeli oluşumunda kanalların açılma sırası nedir? (I T tipi Ca²⁺ · II L tipi Ca²⁺ · III f tipi Na⁺)", "o": ["I, II, III", "I, III, II", "III, I, II", "III, II, I", "II, I, III"], "a": 2, "e": "Funny Na⁺ → T tipi Ca²⁺ → eşikte L tipi Ca²⁺ (faz 0)."}, {"d": "Fizyoloji", "t": "D", "src": "Asıl soru: \"Ca²⁺ kanal blokerinin ventrikül miyokardına etkisi → faz 2\" (2023); aynı şıklar", "q": "Na⁺ kanal blokeri bir ilacın ventrikül miyokardına etkisi hangisidir?", "o": ["Kalpte funny kanallarını uyarır.", "Kontraktiliteyi artırır.", "Kalp atım hızını artırır.", "Ventrikül AP'sinde faz 2'yi azaltır.", "Ventrikül AP'sinde faz 0'ın eğimini azaltır."], "a": 4, "e": "Na⁺ bloker → <strong>faz 0</strong>, Ca²⁺ bloker → faz 2, K⁺ bloker → faz 3."}, {"d": "Fizyoloji", "t": "Y", "src": "Slayt: İyon akımları ve AP", "q": "Kalp kasında kalsiyumla uyarılan kalsiyum salınımında sarkoplazmik retikulumdan Ca²⁺ salınmasını sağlayan reseptör hangisidir?", "o": ["Dihidropiridin reseptörü", "SERCA pompası", "IP3 reseptörü", "Riyanodin reseptörü 2 (RyR2)", "Na⁺/Ca²⁺ değiştirici"], "a": 3, "e": "L tipi kanaldan (DHP reseptörü) giren az Ca²⁺ <strong>RyR2</strong>'yi açar → SR'dan çok Ca²⁺. SERCA geri pompalar."}, {"d": "Fizyoloji", "t": "A", "src": "2F1 · Slayt: EKG giriş", "q": "Kalpte uyarının yayılması ve depolarizasyonla repolarizasyon akımları için hatalı ifadeyi işaretleyiniz.", "o": ["Ventriküllerde önce septum depolarize olur.", "Ventrikül depolarizasyonunun başladığı noktadan ventrikül repolarizasyonu başlar.", "Kalpte depolarizasyonun ortalama yönü sağdan soladır.", "Atriyum depolarizasyonu sağ atriyumda başlar, sol atriyuma yayılır.", "Atriyum repolarizasyonu ile depolarizasyonu aynı bölgeden başlar."], "a": 1, "e": "Ventrikülde repolarizasyon <strong>ters yönde</strong> (epikarttan) başlar; \"aynı yerden başlar\" atriyum için doğru."}, {"d": "Fizyoloji", "t": "Y", "src": "Slayt: EKG giriş", "q": "Ventriküllerde ilk depolarize olan bölge hangisidir?", "o": ["Apeksin epikardı", "Sağ ventrikül serbest duvarı", "İnterventriküler septumun sol tarafının ortası", "Sol ventrikülün bazali", "Papiller kasların ucu"], "a": 2, "e": "Slayt: ilk uyarılan yer <strong>septumun sol tarafının ortası</strong>; bu yüzden septal depolarizasyon soldan sağa."}, {"d": "Fizyoloji", "t": "A", "src": "2K1 · Slayt: EKG II", "q": "Aşağıdaki seçeneklerden hangisinde sırasıyla bir unipolar ekstremite, bir bipolar ekstremite ve bir prekordiyal derivasyon verilmiştir?", "o": ["DII, V1, aVF", "DI, aVL, V4", "aVL, V2, DII", "aVF, DII, V1", "V3, DIII, aVR"], "a": 3, "e": "Unipolar ekstremite <strong>aVR/aVL/aVF</strong>, bipolar <strong>DI/DII/DIII</strong>, prekordiyal <strong>V1–V6</strong>."}, {"d": "Fizyoloji", "t": "D", "src": "Asıl soru: \"Ventrikül depolarizasyonu uzarsa → QRS genişler\" (2K1); aynı şıklar", "q": "AV düğümde iletinin gecikmesinin uzaması EKG'de hangi değişikliğe neden olur?", "o": ["PR aralığının uzaması", "P dalgasının küçülmesi", "QRS genişliğinin artması", "T dalgasının süresinin artması", "QT intervalinin artması"], "a": 0, "e": "AV düğüm gecikmesi <strong>PR aralığı</strong> içindedir (normal 0,12–0,20 s). Uzarsa 1. derece AV blok."}, {"d": "Fizyoloji", "t": "Y", "src": "Slayt: EKG II", "q": "EKG'deki ST segmenti ventrikül aksiyon potansiyelinin hangi fazına karşılık gelir?", "o": ["Faz 0", "Faz 1", "Faz 4", "Faz 3", "Faz 2 (plato)"], "a": 4, "e": "ST = bütün ventrikül depolarize, <strong>plato</strong>. QRS = faz 0, T = faz 3."}, {"d": "Fizyoloji", "t": "A", "src": "2K1 · Derleme · Slayt: Kalp döngüsü giriş", "q": "Kalp ve aort arasındaki basınç farkının en az olduğu yer/an hangisidir?", "o": ["Sistol sırasında sol ventrikül", "Diyastol sırasında sol ventrikül", "Sistol sırasında sağ ventrikül", "Diyastol sırasında sağ ventrikül", "Sistol sırasında sağ atrium"], "a": 0, "e": "Ejeksiyonda aort kapağı açık; sol ventrikül ve aort basıncı neredeyse eşit."}, {"d": "Fizyoloji", "t": "Y", "src": "Slayt: Kalp döngüsü giriş", "q": "Hızlı fırlatma fazında atım hacminin yaklaşık ne kadarı atılır?", "o": ["%15", "%30", "%50", "%70", "%90"], "a": 3, "e": "Slayt: hızlı fırlatmada kanın <strong>~%70</strong>'i, azalmış fırlatmada kalan %30 atılır."}, {"d": "Fizyoloji", "t": "A", "src": "2K1 · Slayt: Kalp döngüsü ve sesler", "q": "Kalp seslerinde \"fizyolojik çiftleşme\" hangi kalp sesi kapsamında ve hangi nedenle gerçekleşir?", "o": ["Birinci kalp sesi, mitral kapağın kapanmasında gecikme", "Birinci kalp sesi, triküspit kapağın kapanmasında gecikme", "İkinci kalp sesi, aort kapağın kapanmasında gecikme", "İkinci kalp sesi, pulmoner kapağın kapanmasında gecikme", "Üçüncü kalp sesi, kanın ventriküllere hızla doluşu"], "a": 3, "e": "İnspirasyonda sağ kalbe daha çok kan → <strong>pulmoner kapak geç kapanır</strong> → S2 çiftleşir."}, {"d": "Fizyoloji", "t": "D", "src": "Asıl soru: \"Diyastol başında atriyumdan akan kanın sesi → S3\" (Derleme); aynı şıklar", "q": "Sertleşmiş (kompliyansı azalmış) ventriküle atriyum kasılmasıyla kanın çarpmasından oluşan ses hangisidir?", "o": ["Üçüncü kalp sesi", "Dördüncü kalp sesi", "İkinci kalp sesi", "Ejeksiyon klik", "Birinci kalp sesi"], "a": 1, "e": "<strong>S4</strong> = atriyal sistol, sert ventrikül. S3 = hızlı doluş."}, {"d": "Fizyoloji", "t": "D", "src": "Asıl soru: \"Frank–Starling grafikleri için hatalı\" (Online · 2K1); bu kez doğru olan", "q": "Frank–Starling mekanizması için hangisi doğrudur?", "o": ["Kasılma gücünü belirleyen en önemli faktör art yüktür.", "Kalp hızındaki artışla açıklanır.", "Kas lifi diyastolde ne kadar gerilirse kasılma gücü o kadar artar.", "Sempatik uyarı olmadan çalışmaz.", "Venöz dönüş arttığında atım hacmi azalır."], "a": 2, "e": "Belirleyici <strong>ön yük</strong> (EDV, lif boyu). Denerve kalpte de çalışır."}, {"d": "Fizyoloji", "t": "Y", "src": "Slayt: Kalp debisi", "q": "Kalp hızı çok yükseldiğinde (ör. 180/dk üzeri) kalp debisinin düşmesinin temel nedeni hangisidir?", "o": ["Kontraktilitenin azalması", "Venöz dönüşün artması", "Art yükün azalması", "Refrakter periyodun uzaması", "Diyastolün kısalması ve doluşun azalması"], "a": 4, "e": "Hız artınca en çok <strong>diyastol</strong> kısalır; doluş süresi yetmez, atım hacmi debiyi koruyamayacak kadar düşer."}, {"d": "Fizyoloji", "t": "D", "src": "Asıl soru: \"LAD'de yarıçap yarıya inince akım → 1/16\" (Derleme); bu kez direnç", "q": "Bir damarın yarıçapı yarıya inerse (diğer koşullar sabit) damar direnci nasıl değişir?", "o": ["16 kat artar", "4 kat artar", "8 kat artar", "2 kat artar", "Değişmez"], "a": 0, "e": "R ∝ 1/r⁴ → (1/2)⁴ = 1/16 → direnç <strong>16 kat</strong> artar, akım 1/16'ya iner."}, {"d": "Fizyoloji", "t": "Y", "src": "Slayt: Dolaşım mekaniği", "q": "Aşağıdakilerden hangisi kanın viskozitesini artırır?", "o": ["Hematokritin azalması", "Hematokritin artması", "Fibrinojenin azalması", "Eritrosit deformabilitesinin artması", "Kan akım hızının artması"], "a": 1, "e": "Viskoziteyi artıranlar: <strong>hematokrit</strong>, fibrinojen, <strong>deformabilitenin azalması</strong>."}, {"d": "Fizyoloji", "t": "Y", "src": "Slayt: Kan akımı ve düzenlenmesi", "q": "Aşağıdakilerden hangisi lokal metabolik vazodilatatör değildir?", "o": ["Adenozin", "CO₂", "H⁺", "K⁺", "Anjiyotensin II"], "a": 4, "e": "Anjiyotensin II hormonal <strong>vazokonstriktör</strong>. Adenozin, CO₂, H⁺, K⁺ metabolik dilatatörler."}, {"d": "Fizyoloji", "t": "Y", "src": "Slayt: Kan akımı ve düzenlenmesi", "q": "Aort ve büyük arterlerin sistolde genişleyip diyastolde geri çekilerek akımı sürdürmesine ne ad verilir?", "o": ["Miyojenik yanıt", "Bainbridge etkisi", "Windkessel etkisi", "Fåhræus–Lindqvist etkisi", "Otoregülasyon"], "a": 2, "e": "<strong>Windkessel</strong>: elastik arterler sistolde kanı depolar, diyastolde akımı sürdürür (histolojide \"elastik arter\" özelliği)."}, {"d": "Fizyoloji", "t": "A", "src": "2023 · Slayt: Kapiller dolaşım", "q": "Aşağıdakilerden hangisindeki artış, kapiller filtrasyon hızının azalmasına neden olur?", "o": ["Kapiller hidrostatik basınç", "Plazma kolloid osmotik basınç", "İnterstisyel kolloid osmotik basınç", "Venöz hidrostatik basınç", "Arteriyolar çap"], "a": 1, "e": "Plazma onkotik basıncı sıvıyı damar içinde tutar; artarsa filtrasyon azalır."}, {"d": "Fizyoloji", "t": "Y", "src": "Slayt: Kapiller dolaşım", "q": "Lenf sıvısı sonunda dolaşıma nereden döner?", "o": ["Sağ atriyumdan doğrudan", "Vena cava inferior'dan", "Subklavian venlerin juguler venlerle birleşim yerinden (angulus venosus)", "Portal venden", "Pulmoner venlerden"], "a": 2, "e": "Ductus thoracicus ve ductus lymphaticus dexter <strong>angulus venosus</strong>'ta (v. subclavia + v. jugularis interna) vene açılır."}, {"d": "Fizyoloji", "t": "D", "src": "Asıl soru: \"Arteriyel baroreseptörlerin yeri ve afferentleri\" (2K1) + \"karotis cisimciği afferenti\" (2025)", "q": "Arcus aortae baroreseptörlerinin afferent lifleri hangi sinirle taşınır?", "o": ["N. vagus", "N. glossopharyngeus", "N. phrenicus", "N. hypoglossus", "Truncus sympathicus"], "a": 0, "e": "Aort → <strong>X (vagus)</strong>, karotis sinüs → <strong>IX (Hering)</strong>. İkisi de NTS'de sonlanır."}, {"d": "Fizyoloji", "t": "Y", "src": "Slayt: KB regülasyonu", "q": "Kan basıncının uzun dönem kontrolünde en güçlü mekanizma hangisidir?", "o": ["Baroreseptör refleksi", "Kemoreseptör refleksi", "MSS iskemik yanıtı", "Böbreğin basınç diürezi ve natriürezi", "Bainbridge refleksi"], "a": 3, "e": "Baroreseptörler uzun vadede yeniden ayarlanır (reset). Uzun dönemi <strong>böbrek–vücut sıvısı</strong> sistemi belirler."}]}, {"id": "d4", "key": "deneme-v4", "tab": "🔥 Zor deneme", "title": "Zor Deneme", "intro": "En çok yanılınan çıkmışlar (roma rakamlı, hesaplı, kökü ters çevrilmiş), onların daha zor değiştirilmiş hâlleri ve slaytların en ince ayrıntıları: sayılar, sıralamalar, CD belirteçleri, akıbet tabloları. Dağılım ve çıkmış oranı yine geçmiş sınavlardaki gibi.", "qs": [{"d": "Histoloji", "t": "A", "src": "Online (resmi anahtar C) · Slayt notu: \"kesintisiz: beyin, kemik, testis, timus\"", "q": "Aşağıdaki şıklardan hangisi kemik kapiller sistemini doğru olarak tanımlamaktadır?", "o": ["Endotel hücreleri pencereli, bazal membranı kesintisizdir.", "Endotel hücreleri kesintisiz, bazal membranı kesintilidir.", "Endotel hücreleri ve bazal membran kesintisizdir.", "Endotel hücreleri ve bazal membran porludur.", "Endotel hücreleri kesintili, bazal membran diyaframlıdır."], "a": 2, "e": "Kemik <strong>dokusunda</strong> sürekli kapiller. Kemik <strong>iliği</strong> sorulsaydı sinüzoid. Kök kelimesine dikkat: çok öğrencinin yanıldığı soru."}, {"d": "Histoloji", "t": "A", "src": "2K1 · Slayt (vurgulu satır)", "q": "Bir biyopsi materyalinin histolojik incelemesinde lenfatik kapiller olmadığı gözlenmiştir. Bu doku aşağıdakilerden hangisinden alınmış olabilir?", "o": ["Kemik iliği", "Karaciğer", "Böbrek", "Lenf nodu", "Akciğer"], "a": 0, "e": "Lenfatik kapiller yok: <strong>kıkırdak, kemik, epitel, MSS, kemik iliği, plasenta</strong>."}, {"d": "Histoloji", "t": "D", "src": "Asıl soru: \"Fetal damar–kalıntı eşleşmesi\" (2023); slaytın akıbet tablosundan roma rakamlı", "q": "Fetal damarların doğum sonrası akıbetleri ile ilgili hangileri doğrudur?<span class=\"rom\"><span>I- Sağ vitellin ven → VCI'nın hepatik segmenti</span><span>II- Sol vitellin ven → portal venin büyük bölümü</span><span>III- Dorsal segmental arterler → interkostal ve vertebral arterler</span><span>IV- Umbilikal arterlerin proksimal parçaları → lig. umbilicale mediale</span><span>V- Vitellin arterler → truncus coeliacus, a. mesenterica superior ve inferior</span></span>", "o": ["I, II, III", "I, II, III, IV, V", "II, III, IV", "I, III, IV, V", "I, II, III, V"], "a": 4, "e": "IV yanlış: umbilikal arterin <strong>proksimali → a. iliaca interna ve a. vesicalis superior</strong>, <strong>distali</strong> → lig. umbilicale mediale. Diğerleri slayttaki akıbet tablosuyla aynı."}, {"d": "Histoloji", "t": "D", "src": "Asıl soru: \"Sinüs venozus boynuzlarına giriş yapmayan\" (2023) ve \"koroner sinüs\" (2K1 · 2025); slayttaki zaman çizelgesi", "q": "Sol sinüs boynuzunun önemini yitirip koroner sinüse dönüşmesine yol açan venlerin tıkanma sırası hangisidir?", "o": ["Sol umbilikal ven → sol vitellin ven → sol kommon kardinal ven", "Sol vitellin ven → sol umbilikal ven → sol kommon kardinal ven", "Sol kommon kardinal ven → sol umbilikal ven → sol vitellin ven", "Sol umbilikal ven → sol kommon kardinal ven → sol vitellin ven", "Sol vitellin ven → sol kommon kardinal ven → sol umbilikal ven"], "a": 0, "e": "Slayt: <strong>sol umbilikal (5 mm) → sol vitellin (7 mm) → sol kommon kardinal (60 mm, 10. hafta)</strong>. Geriye koroner sinüs ve sol atriyumun oblik veni kalır."}, {"d": "Histoloji", "t": "Y", "src": "Slayt: Embriyoloji II, aortik arklar (yıldızlı)", "q": "Aortik arkların akıbetleri ile ilgili hangileri doğrudur?<span class=\"rom\"><span>I- 3. ark → a. carotis communis ve ICA'nın proksimali</span><span>II- Sağ 4. ark → arcus aortae</span><span>III- 1. ark → a. maxillaris</span><span>IV- Sol 6. ark → sol pulmoner arter ve ductus arteriosus</span><span>V- 2. ark → stapedial arter</span></span>", "o": ["I, II, III", "III, IV, V", "II, III, IV", "I, II, IV, V", "I, III, IV, V"], "a": 4, "e": "II yanlış: <strong>sol</strong> 4. ark arcus aortae; <strong>sağ</strong> 4. ark sağ subclavia'nın proksimali. 5. ark rudimenter."}, {"d": "Histoloji", "t": "Y", "src": "Slayt: Kan doku (lenfosit çeşitleri)", "q": "Doğal öldürücü (NK) hücrelerin yüzey belirteçleri hangi seçenekte verilmiştir?", "o": ["CD16, CD56, CD94", "CD19, CD20, CD24", "CD3, CD4, CD8", "CD2, CD5, CD7", "CD9, CD19, CD21"], "a": 0, "e": "Slayt: NK <strong>CD16, CD56, CD94</strong>; T lenfosit CD2, CD3, CD5, CD7 (+CD4/CD8); B lenfosit CD9, CD19, CD20, CD24."}, {"d": "Histoloji", "t": "Y", "src": "Slayt: Kalp ve damar histolojisi, lenfatikler", "q": "Lenfatik kapillerlerle ilgili aşağıdaki ifadelerden hangisi yanlıştır?", "o": ["Ucu kapalı (kör) tüpler şeklinde başlarlar.", "Ductus thoracicus'un yapısı orta büyüklükte bir ven gibidir, medyası daha belirgindir.", "Filament demetleri endoteli çevre bağ dokusuna tutturur.", "Kapakları venlerden daha çok sayıdadır.", "Tam bir bazal laminaya ve sıkı bağlantılara sahip endotelleri vardır."], "a": 4, "e": "Lenfatik kapiller endotelinde <strong>tam bazal lamina ve sıkı bağlantı yoktur</strong>; proteinlerin girişi bu yüzden mümkün."}, {"d": "Anatomi", "t": "A", "src": "Online · Derleme", "q": "Aşağıdaki seçeneklerden hangisi, diz ekleminin kanlanmasında arteria poplitea dallarıyla anastomoz oluşturan arterlerden oluşur?<span class=\"rom\"><span>I- A. circumflexa femoris medialis</span><span>II- A. circumflexa femoris lateralis</span><span>III- A. tibialis anterior</span><span>IV- A. tibialis posterior</span><span>V- A. fibularis</span></span>", "o": ["I, II, III", "I, III, V", "II, III, IV", "II, III, V", "III, IV, V"], "a": 3, "e": "Dize katılan: circumflexa femoris <strong>lateralis</strong> (r. descendens), <strong>tibialis anterior</strong> (recurrens), <strong>fibularis</strong>. Medialis kalçada kalır, tibialis posterior katılmaz."}, {"d": "Anatomi", "t": "A", "src": "2023", "q": "Foramen infrapiriforme'den geçen damar ve sinirler için doğru seçenek hangisidir?<span class=\"rom\"><span>I- N. obturatorius</span><span>II- A. glutea superior</span><span>III- A. glutea inferior</span><span>IV- N. ischiadicus</span><span>V- N. cutaneus femoris posterior</span></span>", "o": ["I, II, IV", "I, III, V", "II, IV, V", "II, III, IV", "III, IV, V"], "a": 4, "e": "POPS IQ. N. obturatorius canalis obturatorius'tan, glutea superior suprapiriforme'den."}, {"d": "Anatomi", "t": "A", "src": "2023", "q": "Aşağıdaki seçeneklerden hangisi tamamı arteria carotis externa'nın dallarından oluşur?<span class=\"rom\"><span>I- A. occipitalis</span><span>II- A. facialis</span><span>III- A. thyroidea inferior</span><span>IV- A. vertebralis</span><span>V- A. thyroidea superior</span></span>", "o": ["I, II, III", "I, II, V", "II, III, V", "II, IV, V", "III, IV, V"], "a": 1, "e": "Thyroidea inferior (truncus thyrocervicalis) ve vertebralis <strong>a. subclavia</strong> sisteminden."}, {"d": "Anatomi", "t": "A", "src": "2023", "q": "Aşağıdaki seçeneklerden hangisi, kalbin ileti sistemine ait yapıların yerleşimi için doğrudur?", "o": ["Nodus sinoatrialis Koch üçgeni içinde yer alır.", "Nodus atrioventricularis sulcus terminalis'te yer alır.", "Fasciculus atrioventricularis, crista terminalis'in içinde yer alır.", "Fasciculus atrioventricularis crus dextrum'u trabecula septomarginalis'ten geçer.", "Plexus subendocardialis, atrium sinistrum'da yer alır."], "a": 3, "e": "Sağ dal moderatör bant içinden ön papiller kasa gider. SA ile AV'nin yerleri ters çevrilmiş, Purkinje atriyumda değil."}, {"d": "Anatomi", "t": "D", "src": "Asıl soru: diafram \"doğru değil\" (2023 · Online · 2K1 · 2025); bu kez açıklıktan geçenler roma rakamlı", "q": "Hiatus aorticus'tan geçen yapılar hangi seçenekte verilmiştir?<span class=\"rom\"><span>I- Aorta</span><span>II- Ductus thoracicus</span><span>III- V. azygos</span><span>IV- N. vagus</span><span>V- Vena cava inferior</span></span>", "o": ["I, II, III", "I, II", "I, III, IV", "I, IV, V", "II, III, V"], "a": 0, "e": "Hiatus aorticus (T12): <strong>aorta, ductus thoracicus, v. azygos</strong>. Vagus hiatus oesophageus (T10), VCI foramen venae cavae (T8)."}, {"d": "Anatomi", "t": "D", "src": "Asıl soru: ulnaris/radialis \"dalı değil\" (Online · 2K1 · 2024); iki sorudaki ortak çeldiriciler", "q": "Aşağıdakilerden hangileri hem a. radialis hem de a. ulnaris tarafından verilir?<span class=\"rom\"><span>I- R. carpalis palmaris</span><span>II- R. carpalis dorsalis</span><span>III- A. interossea communis</span><span>IV- A. princeps pollicis</span><span>V- A. nutricia</span></span>", "o": ["I, II", "III, IV", "I, II, V", "I, III, V", "II, IV, V"], "a": 2, "e": "İki arterde de: <strong>rr. carpales palmaris ve dorsalis, a. nutricia</strong>. Interossea communis yalnız ulnaris, princeps pollicis yalnız radialis."}, {"d": "Anatomi", "t": "D", "src": "Asıl soru: \"Hem mediastinum superius hem posterius'ta\" (2023 · Online · 2025); tersine çevrildi", "q": "Aşağıdakilerden hangisi mediastinum posterius'ta bulunmaz?", "o": ["N. phrenicus", "V. azygos", "Ductus thoracicus", "Aorta thoracica", "Truncus sympathicus"], "a": 0, "e": "N. phrenicus perikardın yanından <strong>mediastinum medius</strong>'ta iner. Posterius: aorta thoracica, azygos/hemiazygos, vagus, oesophagus, ductus thoracicus, truncus sympathicus, nn. splanchnici."}, {"d": "Anatomi", "t": "Y", "src": "Slayt S2-3: koroner venler (ince detay)", "q": "Aşağıdaki kalp venlerinden hangisi sinus coronarius'a dökülmeden doğrudan kalp boşluklarına açılır?", "o": ["V. cordis magna", "V. cordis media", "Vv. cardiacae minimae (Thebesius)", "V. cordis parva", "V. obliqua atrii sinistri"], "a": 2, "e": "Slayt: <strong>vv. cardiacae minimae</strong> ve vv. cardiacae anteriores sinus coronarius'a açılmaz. V. obliqua atrii sinistri (sol boynuz kalıntısı) sinus coronarius'a açılır."}, {"d": "Biyokimya", "t": "A", "src": "2023 (derlemelerde anahtar: ligandin)", "q": "Aşağıdakilerden hangisinin A alt birimine
