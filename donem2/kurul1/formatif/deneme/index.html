2 molekül bilirubin bağlanır?", "o": ["Albümin", "Ligandin", "Z proteini", "Glukuronik asit", "Lumirubin"], "a": 1, "e": "İki ayrı derleme de <strong>ligandin</strong> işaretlemiş. Albüminin alt birimi yok; ligandin (glutatyon S-transferaz) alt birimli. Albümin kanda taşır, soru alt birimi soruyor."}, {"d": "Biyokimya", "t": "A", "src": "2K1", "q": "Aşağıdakilerden hangisi ksenobiyotik metabolizması faz I reaksiyonlarındandır?", "o": ["Asetilasyon", "Dealkilasyon", "Glukuronidasyon", "Metilasyon", "Sülfatasyon"], "a": 1, "e": "Dört şık konjugasyon (faz II). <strong>Dealkilasyon</strong> P450 aracılı faz I."}, {"d": "Biyokimya", "t": "D", "src": "Asıl soru: 2024 \"hücre kültüründe hem sentezi için ortama eklenecekler\" (şıksız kayıt)", "q": "Gerekli bütün enzimlerin bulunduğu bir hücre kültüründe hem sentezlemek için ortama hangilerinin eklenmesi gerekir?<span class=\"rom\"><span>I- Glisin</span><span>II- Süksinil-KoA</span><span>III- Piridoksal fosfat</span><span>IV- Fe²⁺</span><span>V- NAD⁺</span><span>VI- Biotin</span></span>", "o": ["I, II, III, IV, V, VI", "I, II, V", "II, III, VI", "I, IV, V, VI", "I, II, III, IV"], "a": 4, "e": "Substratlar <strong>glisin + süksinil-KoA</strong>, ALA sentaz koenzimi <strong>PLP (B6)</strong>, son basamakta <strong>Fe²⁺</strong>. NAD⁺ ve biotin gerekmez."}, {"d": "Biyokimya", "t": "D", "src": "Asıl soru: \"HbF ile ilgili yanlış → demiri Fe³⁺\" (2025); şıklar ince ayrıntılı", "q": "Fetal hemoglobin (HbF) ile ilgili hangisi yanlıştır?", "o": ["α2γ2 yapısındadır.", "2,3-BPG'yi HbA'dan daha zayıf bağlar.", "Oksijen afinitesi HbA'dan yüksektir.", "Yapısındaki demir Fe³⁺ hâlindedir.", "Disosiyasyon eğrisi HbA'ya göre soldadır."], "a": 3, "e": "Fonksiyonel Hb'de demir <strong>Fe²⁺</strong>. HbF'nin γ zinciri 2,3-BPG'yi zayıf bağlar → afinite yüksek, eğri solda."}, {"d": "Biyokimya", "t": "Y", "src": "Konu: hem yıkımı", "q": "Hem oksijenaz reaksiyonu için gerekli olan kofaktörler hangileridir?", "o": ["O₂ ve NADPH", "NAD⁺ ve FAD", "ATP ve Mg²⁺", "UDP-glukuronik asit", "PLP ve glisin"], "a": 0, "e": "Mikrozomal hem oksijenaz <strong>O₂ ve NADPH</strong> (P450 redüktaz aracılığıyla) kullanır → biliverdin + Fe²⁺ + CO."}, {"d": "Biyokimya", "t": "Y", "src": "Konu: hem sentezinin düzenlenmesi", "q": "Hepatik ALA sentazın hücre içindeki hem düzeyiyle düzenlenmesi nasıldır?", "o": ["Hem, ALA sentazı allosterik olarak aktive eder.", "Hem düzeyi ALA sentazı etkilemez.", "Hem, ALA sentaz sentezini ve mitokondriye girişini baskılar.", "Hem, ferroşelatazı inhibe ederek ALA sentazı artırır.", "Hem, ALA sentazın PLP'ye bağlanmasını artırır."], "a": 2, "e": "Hem (hemin) <strong>negatif geri bildirimle</strong> ALA sentaz sentezini baskılar ve enzimin mitokondriye taşınmasını engeller. Bu yüzden porfiri atağında hemin verilir."}, {"d": "Biyokimya", "t": "Y", "src": "Konu: sitokrom P450 sistemi", "q": "Mikrozomal sitokrom P450 sisteminde NADPH'tan P450'ye elektron aktaran enzim hangisidir?", "o": ["Adrenodoksin", "Glutatyon redüktaz", "Sitokrom c oksidaz", "Biliverdin redüktaz", "NADPH-sitokrom P450 redüktaz"], "a": 4, "e": "ER'de <strong>NADPH-sitokrom P450 redüktaz</strong> (FAD/FMN). Mitokondriyal P450'lerde adrenodoksin ve adrenodoksin redüktaz görev alır (Online sorusundaki çeldirici)."}, {"d": "Biyokimya", "t": "Y", "src": "Konu: hemoglobin yapısı", "q": "Deoksihemoglobinin (T formu) iki β zinciri arasındaki merkezi boşluğa bağlanarak T formunu stabilize eden molekül hangisidir?", "o": ["2,3-bisfosfogliserat", "CO", "O₂", "NO", "Hem"], "a": 0, "e": "<strong>2,3-BPG</strong> β zincirlerindeki pozitif yüklü kalıntılarla tuz köprüsü kurar; HbF'de γ zincirinde bu bağ zayıf."}, {"d": "Fizyoloji", "t": "A", "src": "2023", "q": "Kalp kası ile ilgili aşağıdaki ifadelerden hangisi en doğrudur?", "o": ["Kalp kası T-tübülleri, iskelet kası T-tübüllerine göre daha az gelişmiştir.", "Kalp kası kasılması ve kuvveti, miyositlerin etrafındaki hücre dışı kalsiyum miktarına bağlıdır.", "T tübül sistemi, terminal sisternalar ile birlikte \"triad\" adını da alan bir yapı oluşturur.", "İki adet T tübül sistemi, Z çizgisi hizasında yer alır.", "T tübülleri üzerindeki dihidropiridin yapısı riyanodin kanal aktivasyonunu kontrol eder ve uyarımla onları inaktive eder."], "a": 1, "e": "Kalpte T tübül <strong>5 kat geniş</strong> (az değil), <strong>diad</strong> (triad değil), Z çizgisinde <strong>tek</strong> T tübül. Kasılma hücre dışı Ca²⁺ girişine bağlı."}, {"d": "Fizyoloji", "t": "A", "src": "2023 (anahtar d)", "q": "Poiseuille-Hagen formülüne göre ve direnci oluşturan kanla ilgili nitelikler ile damar ile ilgili belirleyiciler bir arada değerlendirildiğinde hangi sonuca varılabilir?", "o": ["Kan akımı, damar toplam kesit alanı fazla olan bölgelerde yüksek hızdadır.", "Eritrosit deformabilitesinin artması, kanın viskozitesini artırarak kan akımını negatif yönde etkiler.", "Kan akımına olan direnç, damar uzunluğu ile ters orantılı değişir.", "Kan akım hızı, damar yarıçapı ile doğru orantılı değişir.", "Pulmoner dolaşımda direnç, sistemik dolaşıma benzer değerlerdedir."], "a": 3, "e": "Diğer dördü açıkça yanlış: kesit alanı fazla → hız <strong>düşük</strong>; deformabilite artarsa viskozite <strong>azalır</strong>; direnç uzunlukla <strong>doğru</strong> orantılı; pulmoner direnç çok <strong>düşük</strong>. Eleme ile d."}, {"d": "Fizyoloji", "t": "A", "src": "2F1 (derlemede yanlış işaretlenmişti)", "q": "47 yaşında bir erkeğin ejeksiyon fraksiyonu 0,32 ve diyastol sonu hacmi 160 ml'dir. Sistol sonu hacim değeri (yaklaşık) nedir?", "o": ["48 ml", "83 ml", "109 ml", "51 ml", "170 ml"], "a": 2, "e": "SV = 0,32 × 160 = 51 (<strong>tuzak d</strong>). ESV = 160 − 51 = <strong>109</strong>."}, {"d": "Fizyoloji", "t": "A", "src": "2F1", "q": "Sol ventrikül basınç–hacim diyagramında (A mitral açılır, C mitral kapanır, D aort açılır, F aort kapanır) en düşük basınç değeri hangi harf ile tanımlanmıştır ve hangi fazda gözlenir?", "o": ["B noktası, izovolümetrik gevşeme", "A noktası, hızlı doluş", "B nok document.getElementById('finish').addEventListener('click', function () {
  var un = DATA.filter(function (q, i) { return !has(i); }).length;
  if (un && !this.dataset.confirm) { this.dataset.confirm = '1'; this.textContent = un + ' boş var, yine de bitir'; return; }
  st.done = true; save(); paint(); window.scrollTo({ top: 0, behavior: 'smooth' });
});
document.getElementById('reset').addEventListener('click', function () {
  st = { ans: {}, done: false }; save(); var f = document.getElementById('finish'); f.textContent = 'Bitir ve puanla'; delete f.dataset.confirm;
  DATA.forEach(function (q, i) { document.getElementById('q' + i).hidden = false; }); paint(); window.scrollTo({ top: 0 });
});
var start = null; try { start = localStorage.getItem('deneme-tab'); } catch (e) {}
show(start || 'd1', false);
</script></body></html>
