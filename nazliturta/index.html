.big{font-size:2.2rem;font-weight:600;line-height:1.1}

  scoreBox();
}
function grp(key) { var g = {}; DATA.forEach(function (q, i) { var k = q[key]; g[k] = g[k] || [0, 0]; g[k][1]++; if (st.ans[i] === q.a) g[k][0]++; }); return g; }
function scoreBox() {
  var box = document.getElementById('score');
  if (!st.done) { box.classList.remove('show'); box.innerHTML = ''; return; }
  var ok = 0; DATA.forEach(function (q, i) { if (st.ans[i] === q.a) ok++; });
  var h = '<div class="big">' + ok + ' / ' + DATA.length + '</div><div class="rows">';
  var d = grp('d'); DATA.map(function (q) { return q.d; }).filter(function (v, i, a) { return a.indexOf(v) === i; }).forEach(function (k) { var v = d[k];
    h += '<div class="row"><span>' + k + '</span><span>' + v[0] + ' / ' + v[1] + '</span><span class="meter"><i style="width:' + Math.round(100 * v[0] / v[1]) + '%"></i></span></div>'; });
  h += '</div><div class="rows">';
  var t = grp('t'); ['A', 'D', 'Y'].forEach(function (k) { var v = t[k]; if (!v) return;
    h += '<div class="row"><span><span class="tag ' + k + '">' + TN[k] + '</span></span><span>' + v[0] + ' / ' + v[1] + '</span></div>'; });
  h += '</div><p class="note">Önce kolay ve orta sorulardaki yanlışlara dön: en ucuz puan orada. Her yanlışın açıklamasındaki desteyi tekrar oku.</p>';
  h += '<div class="filter"><button class="btn sm" type="button" data-f="all" aria-pressed="true">Hepsi</button><button class="btn sm" type="button" data-f="wrong" aria-pressed="false">Sadece yanlış ve boşlar</button></div>';
  box.innerHTML = h; box.classList.add('show');
  box.querySelectorAll('.filter .btn').forEach(function (b) { b.addEventListener('click', function () {
    box.querySelectorAll('.filter .btn').forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
    DATA.forEach(function (q, i) { document.getElementById('q' + i).hidden = b.dataset.f === 'wrong' && st.ans[i] === q.a; });
  }); });
}
document.getElementById('finish').addEventListener('click', function () {
  var un = DATA.filter(function (q, i) { return !has(i); }).length;
  if (un && !this.dataset.confirm) { this.dataset.confirm = '1'; this.textContent = un + ' boş var, yine de bitir'; return; }
  st.done = true; save(); paint(); window.scrollTo({ top: 0, behavior: 'smooth' });
});
document.getElementById('reset').addEventListener('click', function () {
  st = { ans: {}, done: false }; save(); var f = document.getElementById('finish'); f.textContent = 'Bitir ve puanla'; delete f.dataset.confirm;
  DATA.forEach(function (q, i) { document.getElementById('q' + i).hidden = false; }); paint(); window.scrollTo({ top: 0 });
});
var start = null; try { start = localStorage.getItem('nazli-tab'); } catch (e) {}
show(start || 'n1', false);
</script></body></html>
